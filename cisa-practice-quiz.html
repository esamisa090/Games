<title>CISA Practice Quiz – 150 Questions</title>
<style>
:root {
  --bg: #f5f6f2; --card: #ffffff; --text: #1c2a2d; --muted: #5d6d70; --line: #d9dfdc;
  --accent: #0e6b6b; --accent-ink: #ffffff; --ok: #1d7a46; --ok-bg: #e3f3ea; --bad: #b0341f; --bad-bg: #f9e4df;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1a1c; --card: #172528; --text: #e5ecea; --muted: #9fb0b2; --line: #2b3d40;
    --accent: #4fc0bb; --accent-ink: #0b1517; --ok: #62d28f; --ok-bg: #173325; --bad: #ff8d77; --bad-bg: #3b1f1a;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1a1c; --card: #172528; --text: #e5ecea; --muted: #9fb0b2; --line: #2b3d40;
  --accent: #4fc0bb; --accent-ink: #0b1517; --ok: #62d28f; --ok-bg: #173325; --bad: #ff8d77; --bad-bg: #3b1f1a;
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
*, *::before, *::after { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
main { max-width: 640px; margin: 0 auto; padding: 20px 16px 48px; }
h1, h2 { font-family: Georgia, "Times New Roman", serif; font-weight: 700; line-height: 1.2; margin: 0 0 8px; }
h1 { font-size: 30px; }
h2 { font-size: 22px; }
p { margin: 0 0 12px; }
.muted { color: var(--muted); }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.btn {
  display: block; width: 100%; padding: 14px 16px; border-radius: 10px; border: 1px solid var(--accent);
  background: var(--accent); color: var(--accent-ink); font-weight: 600; text-align: center;
}
.btn.ghost { background: transparent; color: var(--accent); }
.btn + .btn { margin-top: 10px; }
.domains { display: grid; gap: 10px; margin: 20px 0; }
.dom {
  text-align: left; padding: 14px 16px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--card); display: flex; justify-content: space-between; gap: 12px; align-items: center;
}
.dom small { color: var(--muted); white-space: nowrap; }
.top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 8px; font-size: 14px; color: var(--muted); }
.bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin-bottom: 20px; }
.bar > i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .25s; }
.q { font-size: 19px; line-height: 1.4; margin-bottom: 16px; font-weight: 600; }
.opts { display: grid; gap: 10px; }
.opt {
  display: flex; gap: 12px; text-align: left; width: 100%; padding: 13px 14px;
  border-radius: 10px; border: 1.5px solid var(--line); background: var(--card);
}
.opt .l { font-weight: 700; color: var(--accent); min-width: 18px; }
.opt.ok { border-color: var(--ok); background: var(--ok-bg); }
.opt.bad { border-color: var(--bad); background: var(--bad-bg); }
.opt:disabled { cursor: default; }
.fb { margin-top: 16px; padding: 14px 16px; border-radius: 10px; background: var(--card); border: 1px solid var(--line); }
.fb strong.ok { color: var(--ok); } .fb strong.bad { color: var(--bad); }
.nav { margin-top: 16px; }
.score { font-family: Georgia, serif; font-size: 56px; font-weight: 700; line-height: 1; margin: 8px 0 4px; }
.row { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; margin: 14px 0; font-size: 15px; }
.row .bar { grid-column: 1 / -1; margin: 0; }
.miss { padding: 14px 0; border-top: 1px solid var(--line); }
.miss .q { font-size: 16px; margin-bottom: 8px; }
.miss .yours { color: var(--bad); } .miss .right { color: var(--ok); }
.tools { display: flex; justify-content: space-between; margin-top: 28px; font-size: 14px; }
.tools button { background: none; border: 0; color: var(--muted); text-decoration: underline; padding: 6px 0; }
@media (prefers-reduced-motion: reduce) { .bar > i { transition: none; } }
</style>
</head>

var QUESTIONS = RAW.map(function (r, i) {
  return { n: i + 1, d: r[0], q: r[1], o: r[2], a: r[3], e: r[4] };
});
var LETTERS = ["A", "B", "C", "D"];

var app = document.getElementById("app");
var set = [], pos = 0, picks = [], answered = false;

function esc(s) {
  return String(s).replace(/[&<>"]/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
  });
}
function count(d) { return QUESTIONS.filter(function (q) { return q.d === d; }).length; }

function home() {
  var h = '<h1>CISA practice quiz</h1>' +
    '<p class="muted">150 original questions across the five CISA domains, weighted roughly like the real exam. You get the answer and a short explanation after each question.</p>' +
    '<div class="domains">' +
    '<button class="dom" data-d="0"><span><strong>All domains</strong></span><small>' + QUESTIONS.length + ' questions</small></button>';
  DOMAINS.forEach(function (d) {
    h += '<button class="dom" data-d="' + d.id + '"><span>Domain ' + d.id + ': ' + esc(d.name) + '</span><small>' + count(d.id) + ' questions</small></button>';
  });
  h += '</div>' +
    '<p class="muted" style="font-size:14px">These are practice questions on the most frequently tested CISA topics, written in CISA style. They are not real exam questions.</p>';
  app.innerHTML = h;
  app.querySelectorAll(".dom").forEach(function (b) {
    b.onclick = function () {
      var d = +b.getAttribute("data-d");
      start(d === 0 ? QUESTIONS.slice() : QUESTIONS.filter(function (q) { return q.d === d; }));
    };
  });
  window.scrollTo(0, 0);
}

function start(list) {
  set = list; pos = 0; picks = []; answered = false;
  renderQ();
}

function renderQ() {
  var q = set[pos];
  answered = picks[pos] !== undefined;
  var pct = (pos / set.length) * 100;
  var h = '<div class="top"><span>Question ' + (pos + 1) + ' of ' + set.length + '</span><span>Domain ' + q.d + '</span></div>' +
    '<div class="bar"><i style="width:' + pct + '%"></i></div>' +
    '<div class="q">' + esc(q.q) + '</div><div class="opts">';
  q.o.forEach(function (t, i) {
    h += '<button class="opt" data-i="' + i + '"><span class="l">' + LETTERS[i] + '</span><span>' + esc(t) + '</span></button>';
  });
  h += '</div><div id="fb"></div><div class="nav" id="nav"></div>' +
    '<div class="tools"><button id="quit">Quit to menu</button></div>';
  app.innerHTML = h;
  app.querySelectorAll(".opt").forEach(function (b) {
    b.onclick = function () { choose(+b.getAttribute("data-i")); };
  });
  document.getElementById("quit").onclick = home;
  if (answered) showFeedback();
  window.scrollTo(0, 0);
}

function choose(i) {
  if (answered) return;
  picks[pos] = i; answered = true;
  showFeedback();
}

function showFeedback() {
  var q = set[pos], p = picks[pos], right = p === q.a;
  app.querySelectorAll(".opt").forEach(function (b, i) {
    b.disabled = true;
    if (i === q.a) b.classList.add("ok");
    else if (i === p) b.classList.add("bad");
  });
  document.getElementById("fb").innerHTML =
    '<div class="fb" role="status"><strong class="' + (right ? "ok" : "bad") + '">' +
    (right ? "Correct." : "Not quite. The answer is " + LETTERS[q.a] + ".") + '</strong> ' + esc(q.e) + '</div>';
  var last = pos === set.length - 1;
  var nav = document.getElementById("nav");
  nav.innerHTML = '<button class="btn" id="next">' + (last ? "See results" : "Next question") + '</button>';
  document.getElementById("next").onclick = function () {
    if (last) results(); else { pos++; renderQ(); }
  };
  document.getElementById("next").focus({ preventScroll: true });
  nav.scrollIntoView({ block: "nearest", behavior: "smooth" });
}

function results() {
  var correct = 0, byD = {}, wrong = [];
  set.forEach(function (q, i) {
    byD[q.d] = byD[q.d] || { c: 0, t: 0 };
    byD[q.d].t++;
    if (picks[i] === q.a) { correct++; byD[q.d].c++; } else wrong.push({ q: q, p: picks[i] });
  });
  var pct = Math.round((correct / set.length) * 100);
  var h = '<h2>Your result</h2><div class="score">' + pct + '%</div>' +
    '<p class="muted">' + correct + ' correct out of ' + set.length + '. On the real exam you need a scaled score of 450 out of 800, so use this as a rough guide, not a prediction.</p>';
  DOMAINS.forEach(function (d) {
    var s = byD[d.id];
    if (!s) return;
    var dp = Math.round((s.c / s.t) * 100);
    h += '<div class="row"><span>Domain ' + d.id + ': ' + esc(d.name) + '</span><span>' + s.c + '/' + s.t + '</span>' +
      '<div class="bar"><i style="width:' + dp + '%"></i></div></div>';
  });
  h += '<div style="margin-top:20px">';
  if (wrong.length) h += '<button class="btn" id="retry">Retry the ' + wrong.length + ' you missed</button>';
  h += '<button class="btn ghost" id="again">Back to menu</button></div>';
  if (wrong.length) {
    h += '<h2 style="margin-top:32px">Review your mistakes</h2>';
    wrong.forEach(function (w) {
      h += '<div class="miss"><div class="q">' + w.q.n + '. ' + esc(w.q.q) + '</div>' +
        '<div class="yours">Your answer: ' + LETTERS[w.p] + '. ' + esc(w.q.o[w.p]) + '</div>' +
        '<div class="right">Correct: ' + LETTERS[w.q.a] + '. ' + esc(w.q.o[w.q.a]) + '</div>' +
        '<div class="muted" style="margin-top:6px">' + esc(w.q.e) + '</div></div>';
    });
  }
  app.innerHTML = h;
  var r = document.getElementById("retry");
  if (r) r.onclick = function () { start(wrong.map(function (w) { return w.q; })); };
  document.getElementById("again").onclick = home;
  window.scrollTo(0, 0);
}

home();
</script>
