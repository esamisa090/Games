const G={q:"<!DOCTYPE html>\n<html lang=\"ar\" dir=\"rtl\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>لعبة ترتيب آيات القرآن<\/title>\n<style>\n:root{--bg:#fffaf0;--card:#fff3d6;--text:#2c2c2a;--sub:#6b5a2e;--border:#f0c869;--ok:#2e9e5b;--err:#e24b4a;--accent:#7f4fd8;\nbox-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}\n@media (prefers-color-scheme:dark){:root:not([data-theme=\"light\"]){--bg:#1f1b2e;--card:#2c2644;--text:#f6f1ff;--sub:#c9bce8;--border:#5a4a8f;--ok:#5fd68c;--err:#ff8a89;--accent:#b79cff}}\n:root[data-theme=\"dark\"]{--bg:#1f1b2e;--card:#2c2644;--text:#f6f1ff;--sub:#c9bce8;--border:#5a4a8f;--ok:#5fd68c;--err:#ff8a89;--accent:#b79cff}\n*{box-sizing:border-box}\nbody{margin:0;background:var(--bg);color:var(--text);font-family:\"Segoe UI\",Tahoma,Arial,sans-serif;overflow-x:hidden}\nmain{max-width:560px;margin:0 auto;padding:16px;position:relative}\nh1{font-size:24px;font-weight:600;margin:0 0 12px;text-align:center;color:var(--accent)}\nbutton{font:inherit;color:var(--text);background:transparent;border:2px solid var(--border);border-radius:14px;padding:9px 14px;cursor:pointer;transition:transform .12s}\nbutton:active{transform:scale(.95)}\n.tabs{display:flex;margin-bottom:14px}\n.tabs{flex-direction:column}\nbody.nogame .stats,body.nogame .bar,body.nogame .stars,body.nogame .box,body.nogame .pool,body.nogame #msg,body.nogame .actions{display:none}\n.curbtn{width:100%;font-size:19px;font-weight:700;padding:13px 14px;border-radius:14px;background:var(--card);border:2px solid var(--accent);color:var(--text)}\n.ov{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;padding:env(safe-area-inset-top,0px) 14px 24px}\n.ovh{position:sticky;top:0;display:flex;justify-content:space-between;align-items:center;padding:14px 0;background:var(--bg);font-size:20px;z-index:2}\n.ovx{border-radius:50%;width:44px;height:44px;padding:0;font-size:20px}\n.ovg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}\n.sbtn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:64px;padding:8px 4px;background:var(--card);font-size:17px;font-weight:700;line-height:1.4;text-align:center}\n.sbtn small{font-size:12px;font-weight:400;color:var(--sub)}\n.sbtn.on{background:var(--accent);border-color:var(--accent);color:#fff}\n.sbtn.on small{color:#fff}\n.tabs button.on{background:var(--accent);border-color:var(--accent);color:#fff;animation:pop .35s}\n.stats{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px;font-size:15px}\n.pill{background:var(--card);border-radius:999px;padding:5px 12px;font-weight:600}\n.bar{height:12px;background:var(--card);border-radius:999px;overflow:hidden;margin-bottom:6px}\n.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff9f1c,#ffd23f,#2ec4b6);border-radius:999px;transition:width .5s}\n.stars{text-align:center;font-size:22px;min-height:30px;margin-bottom:8px;letter-spacing:4px}\n.stars span{display:inline-block;animation:pop .5s}\n.box{min-height:96px;background:var(--card);border:2px dashed var(--border);border-radius:18px;padding:12px;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;margin-bottom:14px;transition:background .3s,border-color .3s}\n.box.win{border-style:solid;border-color:var(--ok);animation:glow .8s}\n.box.bad{animation:shake .4s;border-color:var(--err)}\n.pool{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px;justify-content:center}\n.chip{font-size:24px;line-height:1.9;padding:4px 18px;border:none;color:#fff;font-weight:500;box-shadow:0 4px 0 rgba(0,0,0,.2);animation:pop .4s backwards}\n.chip:active{box-shadow:0 1px 0 rgba(0,0,0,.2);transform:translateY(3px)}\n.hint{color:var(--sub);font-size:14px;margin:auto}\n#msg{min-height:34px;font-size:20px;font-weight:600;text-align:center;margin-bottom:10px}\n#msg.show{animation:bounce .6s}\n.actions{display:flex;gap:8px}.actions button{flex:1;font-weight:600}\n#next{background:var(--ok);border-color:var(--ok);color:#fff}\n.trophy{font-size:64px;text-align:center;animation:bounce 1s infinite}\n.cf{position:fixed;top:-20px;width:10px;height:14px;z-index:9;pointer-events:none;animation:fall linear forwards}\n@keyframes pop{0%{transform:scale(.5);opacity:0}70%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}\n@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}\n@keyframes bounce{0%,100%{transform:translateY(0)}30%{transform:translateY(-12px)}60%{transform:translateY(0)}80%{transform:translateY(-5px)}}\n@keyframes glow{0%{box-shadow:0 0 0 0 var(--ok)}100%{box-shadow:0 0 0 18px transparent}}\n@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:.9}}\n@media (prefers-reduced-motion:reduce){*{animation:none!important}}\n<\/style>\n<\/head>\n<body>\n<main>\n<h1>🌙 لعبة ترتيب آيات القرآن ⭐<\/h1>\n<div class=\"tabs\" id=\"surahs\"><\/div>\n<div class=\"stats\"><span class=\"pill\" id=\"prog\"><\/span><span class=\"pill\" id=\"streak\"><\/span><span class=\"pill\" id=\"score\"><\/span><\/div>\n<div class=\"bar\"><i id=\"fill\"><\/i><\/div>\n<div class=\"stars\" id=\"stars\"><\/div>\n<div class=\"box\" id=\"answer\"><\/div>\n<div class=\"pool\" id=\"pool\"><\/div>\n<div id=\"msg\"><\/div>\n<div class=\"actions\"><button id=\"reset\">🔄 إعادة<\/button><button id=\"next\">التالية ⬅<\/button><\/div>\n<\/main>\n<script>\nconst DATA={\"الفاتحة\": [\"بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ\", \"ٱلْحَمْدُ لِلَّهِ رَبِّ ٱلْعَٰلَمِينَ\", \"ٱلرَّحْمَٰنِ ٱلرَّحِيمِ\", \"مَٰلِكِ يَوْمِ ٱلدِّينِ\", \"إِيَّاكَ نَعْبُدُ وَإِيَّاكَ نَسْتَعِينُ\", \"ٱهْدِنَا ٱلصِّرَٰطَ ٱلْمُسْتَقِيمَ\", \"صِرَٰطَ ٱلَّذِينَ أَنْعَمْتَ عَلَيْهِمْ غَيْرِ ٱلْمَغْضُوبِ عَلَيْهِمْ وَلَا ٱلضَّآلِّينَ\"], \"الناس\": [\"قُلْ أَعُوذُ بِرَبِّ ٱلنَّاسِ\", \"مَلِكِ ٱلنَّاسِ\", \"إِلَٰهِ ٱلنَّاسِ\", \"مِن شَرِّ ٱلْوَسْوَاسِ ٱلْخَنَّاسِ\", \"ٱلَّذِي يُوَسْوِسُ فِي صُدُورِ ٱلنَّاسِ\", \"مِنَ ٱلْجِنَّةِ وَٱلنَّاسِ\"], \"الفلق\": [\"قُلْ أَعُوذُ بِرَبِّ ٱلْفَلَقِ\", \"مِن شَرِّ مَا خَلَقَ\", \"وَمِن شَرِّ غَاسِقٍ إِذَا وَقَبَ\", \"وَمِن شَرِّ ٱلنَّفَّٰثَٰتِ فِي ٱلْعُقَدِ\", \"وَمِن شَرِّ حَاسِدٍ إِذَا حَسَدَ\"], \"الإخلاص\": [\"قُلْ هُوَ ٱللَّهُ أَحَدٌ\", \"ٱللَّهُ ٱلصَّمَدُ\", \"لَمْ يَلِدْ وَلَمْ يُولَدْ\", \"وَلَمْ يَكُن لَّهُۥ كُفُوًا أَحَدُۢ\"], \"المسد\": [\"تَبَّتْ يَدَآ أَبِي لَهَبٍ وَتَبَّ\", \"مَآ أَغْنَىٰ عَنْهُ مَالُهُۥ وَمَا كَسَبَ\", \"سَيَصْلَىٰ نَارًا ذَاتَ لَهَبٍ\", \"وَٱمْرَأَتُهُۥ حَمَّالَةَ ٱلْحَطَبِ\", \"فِي جِيدِهَا حَبْلٌ مِّن مَّسَدِۭ\"], \"النصر\": [\"إِذَا جَآءَ نَصْرُ ٱللَّهِ وَٱلْفَتْحُ\", \"وَرَأَيْتَ ٱلنَّاسَ يَدْخُلُونَ فِي دِينِ ٱللَّهِ أَفْوَاجًا\", \"فَسَبِّحْ بِحَمْدِ رَبِّكَ وَٱسْتَغْفِرْهُۚ إِنَّهُۥ كَانَ تَوَّابَۢا\"], \"الكافرون\": [\"قُلْ يَٰٓأَيُّهَا ٱلْكَٰفِرُونَ\", \"لَآ أَعْبُدُ مَا تَعْبُدُونَ\", \"وَلَآ أَنتُمْ عَٰبِدُونَ مَآ أَعْبُدُ\", \"وَلَآ أَنَا۠ عَابِدٌ مَّا عَبَدتُّمْ\", \"وَلَآ أَنتُمْ عَٰبِدُونَ مَآ أَعْبُدُ\", \"لَكُمْ دِينُكُمْ وَلِيَ دِينِ\"], \"الكوثر\": [\"إِنَّآ أَعْطَيْنَٰكَ ٱلْكَوْثَرَ\", \"فَصَلِّ لِرَبِّكَ وَٱنْحَرْ\", \"إِنَّ شَانِئَكَ هُوَ ٱلْأَبْتَرُ\"], \"الماعون\": [\"أَرَءَيْتَ ٱلَّذِي يُكَذِّبُ بِٱلدِّينِ\", \"فَذَٰلِكَ ٱلَّذِي يَدُعُّ ٱلْيَتِيمَ\", \"وَلَا يَحُضُّ عَلَىٰ طَعَامِ ٱلْمِسْكِينِ\", \"فَوَيْلٌ لِّلْمُصَلِّينَ\", \"ٱلَّذِينَ هُمْ عَن صَلَاتِهِمْ سَاهُونَ\", \"ٱلَّذِينَ هُمْ يُرَآءُونَ\", \"وَيَمْنَعُونَ ٱلْمَاعُونَ\"], \"قريش\": [\"لِإِيلَٰفِ قُرَيْشٍ\", \"إِۦلَٰفِهِمْ رِحْلَةَ ٱلشِّتَآءِ وَٱلصَّيْفِ\", \"فَلْيَعْبُدُواْ رَبَّ هَٰذَا ٱلْبَيْتِ\", \"ٱلَّذِيٓ أَطْعَمَهُم مِّن جُوعٍ وَءَامَنَهُم مِّنْ خَوْفِۭ\"], \"الفيل\": [\"أَلَمْ تَرَ كَيْفَ فَعَلَ رَبُّكَ بِأَصْحَٰبِ ٱلْفِيلِ\", \"أَلَمْ يَجْعَلْ كَيْدَهُمْ فِي تَضْلِيلٍ\", \"وَأَرْسَلَ عَلَيْهِمْ طَيْرًا أَبَابِيلَ\", \"تَرْمِيهِم بِحِجَارَةٍ مِّن سِجِّيلٍ\", \"فَجَعَلَهُمْ كَعَصْفٍ مَّأْكُولِۭ\"], \"الهمزة\": [\"وَيْلٌ لِّكُلِّ هُمَزَةٍ لُّمَزَةٍ\", \"ٱلَّذِي جَمَعَ مَالًا وَعَدَّدَهُۥ\", \"يَحْسَبُ أَنَّ مَالَهُۥٓ أَخْلَدَهُۥ\", \"كَلَّاۖ لَيُنۢبَذَنَّ فِي ٱلْحُطَمَةِ\", \"وَمَآ أَدْرَىٰكَ مَا ٱلْحُطَمَةُ\", \"نَارُ ٱللَّهِ ٱلْمُوقَدَةُ\", \"ٱلَّتِي تَطَّلِعُ عَلَى ٱلْأَفْـِٔدَةِ\", \"إِنَّهَا عَلَيْهِم مُّؤْصَدَةٌ\", \"فِي عَمَدٍ مُّمَدَّدَةِۭ\"], \"العصر\": [\"وَٱلْعَصْرِ\", \"إِنَّ ٱلْإِنسَٰنَ لَفِي خُسْرٍ\", \"إِلَّا ٱلَّذِينَ ءَامَنُواْ وَعَمِلُواْ ٱلصَّٰلِحَٰتِ وَتَوَاصَوْاْ بِٱلْحَقِّ وَتَوَاصَوْاْ بِٱلصَّبْرِ\"], \"التكاثر\": [\"أَلْهَىٰكُمُ ٱلتَّكَاثُرُ\", \"حَتَّىٰ زُرْتُمُ ٱلْمَقَابِرَ\", \"كَلَّا سَوْفَ تَعْلَمُونَ\", \"ثُمَّ كَلَّا سَوْفَ تَعْلَمُونَ\", \"كَلَّا لَوْ تَعْلَمُونَ عِلْمَ ٱلْيَقِينِ\", \"لَتَرَوُنَّ ٱلْجَحِيمَ\", \"ثُمَّ لَتَرَوُنَّهَا عَيْنَ ٱلْيَقِينِ\", \"ثُمَّ لَتُسْـَٔلُنَّ يَوْمَئِذٍ عَنِ ٱلنَّعِيمِ\"], \"القارعة\": [\"ٱلْقَارِعَةُ\", \"مَا ٱلْقَارِعَةُ\", \"وَمَآ أَدْرَىٰكَ مَا ٱلْقَارِعَةُ\", \"يَوْمَ يَكُونُ ٱلنَّاسُ كَٱلْفَرَاشِ ٱلْمَبْثُوثِ\", \"وَتَكُونُ ٱلْجِبَالُ كَٱلْعِهْنِ ٱلْمَنفُوشِ\", \"فَأَمَّا مَن ثَقُلَتْ مَوَٰزِينُهُۥ\", \"فَهُوَ فِي عِيشَةٍ رَّاضِيَةٍ\", \"وَأَمَّا مَنْ خَفَّتْ مَوَٰزِينُهُۥ\", \"فَأُمُّهُۥ هَاوِيَةٌ\", \"وَمَآ أَدْرَىٰكَ مَا هِيَهْ\", \"نَارٌ حَامِيَةُۢ\"], \"العاديات\": [\"وَٱلْعَٰدِيَٰتِ ضَبْحًا\", \"فَٱلْمُورِيَٰتِ قَدْحًا\", \"فَٱلْمُغِيرَٰتِ صُبْحًا\", \"فَأَثَرْنَ بِهِۦ نَقْعًا\", \"فَوَسَطْنَ بِهِۦ جَمْعًا\", \"إِنَّ ٱلْإِنسَٰنَ لِرَبِّهِۦ لَكَنُودٌ\", \"وَإِنَّهُۥ عَلَىٰ ذَٰلِكَ لَشَهِيدٌ\", \"وَإِنَّهُۥ لِحُبِّ ٱلْخَيْرِ لَشَدِيدٌ\", \"أَفَلَا يَعْلَمُ إِذَا بُعْثِرَ مَا فِي ٱلْقُبُورِ\", \"وَحُصِّلَ مَا فِي ٱلصُّدُورِ\", \"إِنَّ رَبَّهُم بِهِمْ يَوْمَئِذٍ لَّخَبِيرُۢ\"], \"الزلزلة\": [\"إِذَا زُلْزِلَتِ ٱلْأَرْضُ زِلْزَالَهَا\", \"وَأَخْرَجَتِ ٱلْأَرْضُ أَثْقَالَهَا\", \"وَقَالَ ٱلْإِنسَٰنُ مَا لَهَا\", \"يَوْمَئِذٍ تُحَدِّثُ أَخْبَارَهَا\", \"بِأَنَّ رَبَّكَ أَوْحَىٰ لَهَا\", \"يَوْمَئِذٍ يَصْدُرُ ٱلنَّاسُ أَشْتَاتًا لِّيُرَوْاْ أَعْمَٰلَهُمْ\", \"فَمَن يَعْمَلْ مِثْقَالَ ذَرَّةٍ خَيْرًا يَرَهُۥ\", \"وَمَن يَعْمَلْ مِثْقَالَ ذَرَّةٍ شَرًّا يَرَهُۥ\"], \"البينة\": [\"لَمْ يَكُنِ ٱلَّذِينَ كَفَرُواْ مِنْ أَهْلِ ٱلْكِتَٰبِ وَٱلْمُشْرِكِينَ مُنفَكِّينَ حَتَّىٰ تَأْتِيَهُمُ ٱلْبَيِّنَةُ\", \"رَسُولٌ مِّنَ ٱللَّهِ يَتْلُواْ صُحُفًا مُّطَهَّرَةً\", \"فِيهَا كُتُبٌ قَيِّمَةٌ\", \"وَمَا تَفَرَّقَ ٱلَّذِينَ أُوتُواْ ٱلْكِتَٰبَ إِلَّا مِنۢ بَعْدِ مَا جَآءَتْهُمُ ٱلْبَيِّنَةُ\", \"وَمَآ أُمِرُوٓاْ إِلَّا لِيَعْبُدُواْ ٱللَّهَ مُخْلِصِينَ لَهُ ٱلدِّينَ حُنَفَآءَ وَيُقِيمُواْ ٱلصَّلَوٰةَ وَيُؤْتُواْ ٱلزَّكَوٰةَۚ وَذَٰلِكَ دِينُ ٱلْقَيِّمَةِ\", \"إِنَّ ٱلَّذِينَ كَفَرُواْ مِنْ أَهْلِ ٱلْكِتَٰبِ وَٱلْمُشْرِكِينَ فِي نَارِ جَهَنَّمَ خَٰلِدِينَ فِيهَآۚ أُوْلَٰٓئِكَ هُمْ شَرُّ ٱلْبَرِيَّةِ\", \"إِنَّ ٱلَّذِينَ ءَامَنُواْ وَعَمِلُواْ ٱلصَّٰلِحَٰتِ أُوْلَٰٓئِكَ هُمْ خَيْرُ ٱلْبَرِيَّةِ\", \"جَزَآؤُهُمْ عِندَ رَبِّهِمْ جَنَّٰتُ عَدْنٍ تَجْرِي مِن تَحْتِهَا ٱلْأَنْهَٰرُ خَٰلِدِينَ فِيهَآ أَبَدًاۖ رَّضِيَ ٱللَّهُ عَنْهُمْ وَرَضُواْ عَنْهُۚ ذَٰلِكَ لِمَنْ خَشِيَ رَبَّهُۥ\"], \"القدر\": [\"إِنَّآ أَنزَلْنَٰهُ فِي لَيْلَةِ ٱلْقَدْرِ\", \"وَمَآ أَدْرَىٰكَ مَا لَيْلَةُ ٱلْقَدْرِ\", \"لَيْلَةُ ٱلْقَدْرِ خَيْرٌ مِّنْ أَلْفِ شَهْرٍ\", \"تَنَزَّلُ ٱلْمَلَٰٓئِكَةُ وَٱلرُّوحُ فِيهَا بِإِذْنِ رَبِّهِم مِّن كُلِّ أَمْرٍ\", \"سَلَٰمٌ هِيَ حَتَّىٰ مَطْلَعِ ٱلْفَجْرِ\"], \"العلق\": [\"ٱقْرَأْ بِٱسْمِ رَبِّكَ ٱلَّذِي خَلَقَ\", \"خَلَقَ ٱلْإِنسَٰنَ مِنْ عَلَقٍ\", \"ٱقْرَأْ وَرَبُّكَ ٱلْأَكْرَمُ\", \"ٱلَّذِي عَلَّمَ بِٱلْقَلَمِ\", \"عَلَّمَ ٱلْإِنسَٰنَ مَا لَمْ يَعْلَمْ\", \"كَلَّآ إِنَّ ٱلْإِنسَٰنَ لَيَطْغَىٰٓ\", \"أَن رَّءَاهُ ٱسْتَغْنَىٰٓ\", \"إِنَّ إِلَىٰ رَبِّكَ ٱلرُّجْعَىٰٓ\", \"أَرَءَيْتَ ٱلَّذِي يَنْهَىٰ\", \"عَبْدًا إِذَا صَلَّىٰٓ\", \"أَرَءَيْتَ إِن كَانَ عَلَى ٱلْهُدَىٰٓ\", \"أَوْ أَمَرَ بِٱلتَّقْوَىٰٓ\", \"أَرَءَيْتَ إِن كَذَّبَ وَتَوَلَّىٰٓ\", \"أَلَمْ يَعْلَم بِأَنَّ ٱللَّهَ يَرَىٰ\", \"كَلَّا لَئِن لَّمْ يَنتَهِ لَنَسْفَعَۢا بِٱلنَّاصِيَةِ\", \"نَاصِيَةٍ كَٰذِبَةٍ خَاطِئَةٍ\", \"فَلْيَدْعُ نَادِيَهُۥ\", \"سَنَدْعُ ٱلزَّبَانِيَةَ\", \"كَلَّا لَا تُطِعْهُ وَٱسْجُدْۤ وَٱقْتَرِب۩\"], \"التين\": [\"وَٱلتِّينِ وَٱلزَّيْتُونِ\", \"وَطُورِ سِينِينَ\", \"وَهَٰذَا ٱلْبَلَدِ ٱلْأَمِينِ\", \"لَقَدْ خَلَقْنَا ٱلْإِنسَٰنَ فِيٓ أَحْسَنِ تَقْوِيمٍ\", \"ثُمَّ رَدَدْنَٰهُ أَسْفَلَ سَٰفِلِينَ\", \"إِلَّا ٱلَّذِينَ ءَامَنُواْ وَعَمِلُواْ ٱلصَّٰلِحَٰتِ فَلَهُمْ أَجْرٌ غَيْرُ مَمْنُونٍ\", \"فَمَا يُكَذِّبُكَ بَعْدُ بِٱلدِّينِ\", \"أَلَيْسَ ٱللَّهُ بِأَحْكَمِ ٱلْحَٰكِمِينَ\"], \"الشرح\": [\"أَلَمْ نَشْرَحْ لَكَ صَدْرَكَ\", \"وَوَضَعْنَا عَنكَ وِزْرَكَ\", \"ٱلَّذِيٓ أَنقَضَ ظَهْرَكَ\", \"وَرَفَعْنَا لَكَ ذِكْرَكَ\", \"فَإِنَّ مَعَ ٱلْعُسْرِ يُسْرًا\", \"إِنَّ مَعَ ٱلْعُسْرِ يُسْرًا\", \"فَإِذَا فَرَغْتَ فَٱنصَبْ\", \"وَإِلَىٰ رَبِّكَ فَٱرْغَب\"], \"الضحى\": [\"وَٱلضُّحَىٰ\", \"وَٱلَّيْلِ إِذَا سَجَىٰ\", \"مَا وَدَّعَكَ رَبُّكَ وَمَا قَلَىٰ\", \"وَلَلْأٓخِرَةُ خَيْرٌ لَّكَ مِنَ ٱلْأُولَىٰ\", \"وَلَسَوْفَ يُعْطِيكَ رَبُّكَ فَتَرْضَىٰٓ\", \"أَلَمْ يَجِدْكَ يَتِيمًا فَـَٔاوَىٰ\", \"وَوَجَدَكَ ضَآلًّا فَهَدَىٰ\", \"وَوَجَدَكَ عَآئِلًا فَأَغْنَىٰ\", \"فَأَمَّا ٱلْيَتِيمَ فَلَا تَقْهَرْ\", \"وَأَمَّا ٱلسَّآئِلَ فَلَا تَنْهَرْ\", \"وَأَمَّا بِنِعْمَةِ رَبِّكَ فَحَدِّثْ\"], \"الليل\": [\"وَٱلَّيْلِ إِذَا يَغْشَىٰ\", \"وَٱلنَّهَارِ إِذَا تَجَلَّىٰ\", \"وَمَا خَلَقَ ٱلذَّكَرَ وَٱلْأُنثَىٰٓ\", \"إِنَّ سَعْيَكُمْ لَشَتَّىٰ\", \"فَأَمَّا مَنْ أَعْطَىٰ وَٱتَّقَىٰ\", \"وَصَدَّقَ بِٱلْحُسْنَىٰ\", \"فَسَنُيَسِّرُهُۥ لِلْيُسْرَىٰ\", \"وَأَمَّا مَنۢ بَخِلَ وَٱسْتَغْنَىٰ\", \"وَكَذَّبَ بِٱلْحُسْنَىٰ\", \"فَسَنُيَسِّرُهُۥ لِلْعُسْرَىٰ\", \"وَمَا يُغْنِي عَنْهُ مَالُهُۥٓ إِذَا تَرَدَّىٰٓ\", \"إِنَّ عَلَيْنَا لَلْهُدَىٰ\", \"وَإِنَّ لَنَا لَلْأٓخِرَةَ وَٱلْأُولَىٰ\", \"فَأَنذَرْتُكُمْ نَارًا تَلَظَّىٰ\", \"لَا يَصْلَىٰهَآ إِلَّا ٱلْأَشْقَى\", \"ٱلَّذِي كَذَّبَ وَتَوَلَّىٰ\", \"وَسَيُجَنَّبُهَا ٱلْأَتْقَى\", \"ٱلَّذِي يُؤْتِي مَالَهُۥ يَتَزَكَّىٰ\", \"وَمَا لِأَحَدٍ عِندَهُۥ مِن نِّعْمَةٍ تُجْزَىٰٓ\", \"إِلَّا ٱبْتِغَآءَ وَجْهِ رَبِّهِ ٱلْأَعْلَىٰ\", \"وَلَسَوْفَ يَرْضَىٰ\"], \"الشمس\": [\"وَٱلشَّمْسِ وَضُحَىٰهَا\", \"وَٱلْقَمَرِ إِذَا تَلَىٰهَا\", \"وَٱلنَّهَارِ إِذَا جَلَّىٰهَا\", \"وَٱلَّيْلِ إِذَا يَغْشَىٰهَا\", \"وَٱلسَّمَآءِ وَمَا بَنَىٰهَا\", \"وَٱلْأَرْضِ وَمَا طَحَىٰهَا\", \"وَنَفْسٍ وَمَا سَوَّىٰهَا\", \"فَأَلْهَمَهَا فُجُورَهَا وَتَقْوَىٰهَا\", \"قَدْ أَفْلَحَ مَن زَكَّىٰهَا\", \"وَقَدْ خَابَ مَن دَسَّىٰهَا\", \"كَذَّبَتْ ثَمُودُ بِطَغْوَىٰهَآ\", \"إِذِ ٱنۢبَعَثَ أَشْقَىٰهَا\", \"فَقَالَ لَهُمْ رَسُولُ ٱللَّهِ نَاقَةَ ٱللَّهِ وَسُقْيَٰهَا\", \"فَكَذَّبُوهُ فَعَقَرُوهَا فَدَمْدَمَ عَلَيْهِمْ رَبُّهُم بِذَنۢبِهِمْ فَسَوَّىٰهَا\", \"وَلَا يَخَافُ عُقْبَٰهَا\"], \"البلد\": [\"لَآ أُقْسِمُ بِهَٰذَا ٱلْبَلَدِ\", \"وَأَنتَ حِلُّۢ بِهَٰذَا ٱلْبَلَدِ\", \"وَوَالِدٍ وَمَا وَلَدَ\", \"لَقَدْ خَلَقْنَا ٱلْإِنسَٰنَ فِي كَبَدٍ\", \"أَيَحْسَبُ أَن لَّن يَقْدِرَ عَلَيْهِ أَحَدٌ\", \"يَقُولُ أَهْلَكْتُ مَالًا لُّبَدًا\", \"أَيَحْسَبُ أَن لَّمْ يَرَهُۥٓ أَحَدٌ\", \"أَلَمْ نَجْعَل لَّهُۥ عَيْنَيْنِ\", \"وَلِسَانًا وَشَفَتَيْنِ\", \"وَهَدَيْنَٰهُ ٱلنَّجْدَيْنِ\", \"فَلَا ٱقْتَحَمَ ٱلْعَقَبَةَ\", \"وَمَآ أَدْرَىٰكَ مَا ٱلْعَقَبَةُ\", \"فَكُّ رَقَبَةٍ\", \"أَوْ إِطْعَٰمٌ فِي يَوْمٍ ذِي مَسْغَبَةٍ\", \"يَتِيمًا ذَا مَقْرَبَةٍ\", \"أَوْ مِسْكِينًا ذَا مَتْرَبَةٍ\", \"ثُمَّ كَانَ مِنَ ٱلَّذِينَ ءَامَنُواْ وَتَوَاصَوْاْ بِٱلصَّبْرِ وَتَوَاصَوْاْ بِٱلْمَرْحَمَةِ\", \"أُوْلَٰٓئِكَ أَصْحَٰبُ ٱلْمَيْمَنَةِ\", \"وَٱلَّذِينَ كَفَرُواْ بِـَٔايَٰتِنَا هُمْ أَصْحَٰبُ ٱلْمَشْـَٔمَةِ\", \"عَلَيْهِمْ نَارٌ مُّؤْصَدَةُۢ\"], \"الفجر\": [\"وَٱلْفَجْرِ\", \"وَلَيَالٍ عَشْرٍ\", \"وَٱلشَّفْعِ وَٱلْوَتْرِ\", \"وَٱلَّيْلِ إِذَا يَسْرِ\", \"هَلْ فِي ذَٰلِكَ قَسَمٌ لِّذِي حِجْرٍ\", \"أَلَمْ تَرَ كَيْفَ فَعَلَ رَبُّكَ بِعَادٍ\", \"إِرَمَ ذَاتِ ٱلْعِمَادِ\", \"ٱلَّتِي لَمْ يُخْلَقْ مِثْلُهَا فِي ٱلْبِلَٰدِ\", \"وَثَمُودَ ٱلَّذِينَ جَابُواْ ٱلصَّخْرَ بِٱلْوَادِ\", \"وَفِرْعَوْنَ ذِي ٱلْأَوْتَادِ\", \"ٱلَّذِينَ طَغَوْاْ فِي ٱلْبِلَٰدِ\", \"فَأَكْثَرُواْ فِيهَا ٱلْفَسَادَ\", \"فَصَبَّ عَلَيْهِمْ رَبُّكَ سَوْطَ عَذَابٍ\", \"إِنَّ رَبَّكَ لَبِٱلْمِرْصَادِ\", \"فَأَمَّا ٱلْإِنسَٰنُ إِذَا مَا ٱبْتَلَىٰهُ رَبُّهُۥ فَأَكْرَمَهُۥ وَنَعَّمَهُۥ فَيَقُولُ رَبِّيٓ أَكْرَمَنِ\", \"وَأَمَّآ إِذَا مَا ٱبْتَلَىٰهُ فَقَدَرَ عَلَيْهِ رِزْقَهُۥ فَيَقُولُ رَبِّيٓ أَهَٰنَنِ\", \"كَلَّاۖ بَل لَّا تُكْرِمُونَ ٱلْيَتِيمَ\", \"وَلَا تَحَٰٓضُّونَ عَلَىٰ طَعَامِ ٱلْمِسْكِينِ\", \"وَتَأْكُلُونَ ٱلتُّرَاثَ أَكْلًا لَّمًّا\", \"وَتُحِبُّونَ ٱلْمَالَ حُبًّا جَمًّا\", \"كَلَّآۖ إِذَا دُكَّتِ ٱلْأَرْضُ دَكًّا دَكًّا\", \"وَجَآءَ رَبُّكَ وَٱلْمَلَكُ صَفًّا صَفًّا\", \"وَجِاْيٓءَ يَوْمَئِذِۭ بِجَهَنَّمَۚ يَوْمَئِذٍ يَتَذَكَّرُ ٱلْإِنسَٰنُ وَأَنَّىٰ لَهُ ٱلذِّكْرَىٰ\", \"يَقُولُ يَٰلَيْتَنِي قَدَّمْتُ لِحَيَاتِي\", \"فَيَوْمَئِذٍ لَّا يُعَذِّبُ عَذَابَهُۥٓ أَحَدٌ\", \"وَلَا يُوثِقُ وَثَاقَهُۥٓ أَحَدٌ\", \"يَٰٓأَيَّتُهَا ٱلنَّفْسُ ٱلْمُطْمَئِنَّةُ\", \"ٱرْجِعِيٓ إِلَىٰ رَبِّكِ رَاضِيَةً مَّرْضِيَّةً\", \"فَٱدْخُلِي فِي عِبَٰدِي\", \"وَٱدْخُلِي جَنَّتِي\"], \"الغاشية\": [\"هَلْ أَتَىٰكَ حَدِيثُ ٱلْغَٰشِيَةِ\", \"وُجُوهٌ يَوْمَئِذٍ خَٰشِعَةٌ\", \"عَامِلَةٌ نَّاصِبَةٌ\", \"تَصْلَىٰ نَارًا حَامِيَةً\", \"تُسْقَىٰ مِنْ عَيْنٍ ءَانِيَةٍ\", \"لَّيْسَ لَهُمْ طَعَامٌ إِلَّا مِن ضَرِيعٍ\", \"لَّا يُسْمِنُ وَلَا يُغْنِي مِن جُوعٍ\", \"وُجُوهٌ يَوْمَئِذٍ نَّاعِمَةٌ\", \"لِّسَعْيِهَا رَاضِيَةٌ\", \"فِي جَنَّةٍ عَالِيَةٍ\", \"لَّا تَسْمَعُ فِيهَا لَٰغِيَةً\", \"فِيهَا عَيْنٌ جَارِيَةٌ\", \"فِيهَا سُرُرٌ مَّرْفُوعَةٌ\", \"وَأَكْوَابٌ مَّوْضُوعَةٌ\", \"وَنَمَارِقُ مَصْفُوفَةٌ\", \"وَزَرَابِيُّ مَبْثُوثَةٌ\", \"أَفَلَا يَنظُرُونَ إِلَى ٱلْإِبِلِ كَيْفَ خُلِقَتْ\", \"وَإِلَى ٱلسَّمَآءِ كَيْفَ رُفِعَتْ\", \"وَإِلَى ٱلْجِبَالِ كَيْفَ نُصِبَتْ\", \"وَإِلَى ٱلْأَرْضِ كَيْفَ سُطِحَتْ\", \"فَذَكِّرْ إِنَّمَآ أَنتَ مُذَكِّرٌ\", \"لَّسْتَ عَلَيْهِم بِمُصَيْطِرٍ\", \"إِلَّا مَن تَوَلَّىٰ وَكَفَرَ\", \"فَيُعَذِّبُهُ ٱللَّهُ ٱلْعَذَابَ ٱلْأَكْبَرَ\", \"إِنَّ إِلَيْنَآ إِيَابَهُمْ\", \"ثُمَّ إِنَّ عَلَيْنَا حِسَابَهُم\"], \"الأعلى\": [\"سَبِّحِ ٱسْمَ رَبِّكَ ٱلْأَعْلَى\", \"ٱلَّذِي خَلَقَ فَسَوَّىٰ\", \"وَٱلَّذِي قَدَّرَ فَهَدَىٰ\", \"وَٱلَّذِيٓ أَخْرَجَ ٱلْمَرْعَىٰ\", \"فَجَعَلَهُۥ غُثَآءً أَحْوَىٰ\", \"سَنُقْرِئُكَ فَلَا تَنسَىٰٓ\", \"إِلَّا مَا شَآءَ ٱللَّهُۚ إِنَّهُۥ يَعْلَمُ ٱلْجَهْرَ وَمَا يَخْفَىٰ\", \"وَنُيَسِّرُكَ لِلْيُسْرَىٰ\", \"فَذَكِّرْ إِن نَّفَعَتِ ٱلذِّكْرَىٰ\", \"سَيَذَّكَّرُ مَن يَخْشَىٰ\", \"وَيَتَجَنَّبُهَا ٱلْأَشْقَى\", \"ٱلَّذِي يَصْلَى ٱلنَّارَ ٱلْكُبْرَىٰ\", \"ثُمَّ لَا يَمُوتُ فِيهَا وَلَا يَحْيَىٰ\", \"قَدْ أَفْلَحَ مَن تَزَكَّىٰ\", \"وَذَكَرَ ٱسْمَ رَبِّهِۦ فَصَلَّىٰ\", \"بَلْ تُؤْثِرُونَ ٱلْحَيَوٰةَ ٱلدُّنْيَا\", \"وَٱلْأٓخِرَةُ خَيْرٌ وَأَبْقَىٰٓ\", \"إِنَّ هَٰذَا لَفِي ٱلصُّحُفِ ٱلْأُولَىٰ\", \"صُحُفِ إِبْرَٰهِيمَ وَمُوسَىٰ\"], \"الطارق\": [\"وَٱلسَّمَآءِ وَٱلطَّارِقِ\", \"وَمَآ أَدْرَىٰكَ مَا ٱلطَّارِقُ\", \"ٱلنَّجْمُ ٱلثَّاقِبُ\", \"إِن كُلُّ نَفْسٍ لَّمَّا عَلَيْهَا حَافِظٌ\", \"فَلْيَنظُرِ ٱلْإِنسَٰنُ مِمَّ خُلِقَ\", \"خُلِقَ مِن مَّآءٍ دَافِقٍ\", \"يَخْرُجُ مِنۢ بَيْنِ ٱلصُّلْبِ وَٱلتَّرَآئِبِ\", \"إِنَّهُۥ عَلَىٰ رَجْعِهِۦ لَقَادِرٌ\", \"يَوْمَ تُبْلَى ٱلسَّرَآئِرُ\", \"فَمَا لَهُۥ مِن قُوَّةٍ وَلَا نَاصِرٍ\", \"وَٱلسَّمَآءِ ذَاتِ ٱلرَّجْعِ\", \"وَٱلْأَرْضِ ذَاتِ ٱلصَّدْعِ\", \"إِنَّهُۥ لَقَوْلٌ فَصْلٌ\", \"وَمَا هُوَ بِٱلْهَزْلِ\", \"إِنَّهُمْ يَكِيدُونَ كَيْدًا\", \"وَأَكِيدُ كَيْدًا\", \"فَمَهِّلِ ٱلْكَٰفِرِينَ أَمْهِلْهُمْ رُوَيْدَۢا\"], \"البروج\": [\"وَٱلسَّمَآءِ ذَاتِ ٱلْبُرُوجِ\", \"وَٱلْيَوْمِ ٱلْمَوْعُودِ\", \"وَشَاهِدٍ وَمَشْهُودٍ\", \"قُتِلَ أَصْحَٰبُ ٱلْأُخْدُودِ\", \"ٱلنَّارِ ذَاتِ ٱلْوَقُودِ\", \"إِذْ هُمْ عَلَيْهَا قُعُودٌ\", \"وَهُمْ عَلَىٰ مَا يَفْعَلُونَ بِٱلْمُؤْمِنِينَ شُهُودٌ\", \"وَمَا نَقَمُواْ مِنْهُمْ إِلَّآ أَن يُؤْمِنُواْ بِٱللَّهِ ٱلْعَزِيزِ ٱلْحَمِيدِ\", \"ٱلَّذِي لَهُۥ مُلْكُ ٱلسَّمَٰوَٰتِ وَٱلْأَرْضِۚ وَٱللَّهُ عَلَىٰ كُلِّ شَيْءٍ شَهِيدٌ\", \"إِنَّ ٱلَّذِينَ فَتَنُواْ ٱلْمُؤْمِنِينَ وَٱلْمُؤْمِنَٰتِ ثُمَّ لَمْ يَتُوبُواْ فَلَهُمْ عَذَابُ جَهَنَّمَ وَلَهُمْ عَذَابُ ٱلْحَرِيقِ\", \"إِنَّ ٱلَّذِينَ ءَامَنُواْ وَعَمِلُواْ ٱلصَّٰلِحَٰتِ لَهُمْ جَنَّٰتٌ تَجْرِي مِن تَحْتِهَا ٱلْأَنْهَٰرُۚ ذَٰلِكَ ٱلْفَوْزُ ٱلْكَبِيرُ\", \"إِنَّ بَطْشَ رَبِّكَ لَشَدِيدٌ\", \"إِنَّهُۥ هُوَ يُبْدِئُ وَيُعِيدُ\", \"وَهُوَ ٱلْغَفُورُ ٱلْوَدُودُ\", \"ذُو ٱلْعَرْشِ ٱلْمَجِيدُ\", \"فَعَّالٌ لِّمَا يُرِيدُ\", \"هَلْ أَتَىٰكَ حَدِيثُ ٱلْجُنُودِ\", \"فِرْعَوْنَ وَثَمُودَ\", \"بَلِ ٱلَّذِينَ كَفَرُواْ فِي تَكْذِيبٍ\", \"وَٱللَّهُ مِن وَرَآئِهِم مُّحِيطُۢ\", \"بَلْ هُوَ قُرْءَانٌ مَّجِيدٌ\", \"فِي لَوْحٍ مَّحْفُوظِۭ\"], \"الانشقاق\": [\"إِذَا ٱلسَّمَآءُ ٱنشَقَّتْ\", \"وَأَذِنَتْ لِرَبِّهَا وَحُقَّتْ\", \"وَإِذَا ٱلْأَرْضُ مُدَّتْ\", \"وَأَلْقَتْ مَا فِيهَا وَتَخَلَّتْ\", \"وَأَذِنَتْ لِرَبِّهَا وَحُقَّتْ\", \"يَٰٓأَيُّهَا ٱلْإِنسَٰنُ إِنَّكَ كَادِحٌ إِلَىٰ رَبِّكَ كَدْحًا فَمُلَٰقِيهِ\", \"فَأَمَّا مَنْ أُوتِيَ كِتَٰبَهُۥ بِيَمِينِهِۦ\", \"فَسَوْفَ يُحَاسَبُ حِسَابًا يَسِيرًا\", \"وَيَنقَلِبُ إِلَىٰٓ أَهْلِهِۦ مَسْرُورًا\", \"وَأَمَّا مَنْ أُوتِيَ كِتَٰبَهُۥ وَرَآءَ ظَهْرِهِۦ\", \"فَسَوْفَ يَدْعُواْ ثُبُورًا\", \"وَيَصْلَىٰ سَعِيرًا\", \"إِنَّهُۥ كَانَ فِيٓ أَهْلِهِۦ مَسْرُورًا\", \"إِنَّهُۥ ظَنَّ أَن لَّن يَحُورَ\", \"بَلَىٰٓۚ إِنَّ رَبَّهُۥ كَانَ بِهِۦ بَصِيرًا\", \"فَلَآ أُقْسِمُ بِٱلشَّفَقِ\", \"وَٱلَّيْلِ وَمَا وَسَقَ\", \"وَٱلْقَمَرِ إِذَا ٱتَّسَقَ\", \"لَتَرْكَبُنَّ طَبَقًا عَن طَبَقٍ\", \"فَمَا لَهُمْ لَا يُؤْمِنُونَ\", \"وَإِذَا قُرِئَ عَلَيْهِمُ ٱلْقُرْءَانُ لَا يَسْجُدُونَۤ۩\", \"بَلِ ٱلَّذِينَ كَفَرُواْ يُكَذِّبُونَ\", \"وَٱللَّهُ أَعْلَمُ بِمَا يُوعُونَ\", \"فَبَشِّرْهُم بِعَذَابٍ أَلِيمٍ\", \"إِلَّا ٱلَّذِينَ ءَامَنُواْ وَعَمِلُواْ ٱلصَّٰلِحَٰتِ لَهُمْ أَجْرٌ غَيْرُ مَمْنُونِۭ\"], \"المطففين\": [\"وَيْلٌ لِّلْمُطَفِّفِينَ\", \"ٱلَّذِينَ إِذَا ٱكْتَالُواْ عَلَى ٱلنَّاسِ يَسْتَوْفُونَ\", \"وَإِذَا كَالُوهُمْ أَو وَّزَنُوهُمْ يُخْسِرُونَ\", \"أَلَا يَظُنُّ أُوْلَٰٓئِكَ أَنَّهُم مَّبْعُوثُونَ\", \"لِيَوْمٍ عَظِيمٍ\", \"يَوْمَ يَقُومُ ٱلنَّاسُ لِرَبِّ ٱلْعَٰلَمِينَ\", \"كَلَّآ إِنَّ كِتَٰبَ ٱلْفُجَّارِ لَفِي سِجِّينٍ\", \"وَمَآ أَدْرَىٰكَ مَا سِجِّينٌ\", \"كِتَٰبٌ مَّرْقُومٌ\", \"وَيْلٌ يَوْمَئِذٍ لِّلْمُكَذِّبِينَ\", \"ٱلَّذِينَ يُكَذِّبُونَ بِيَوْمِ ٱلدِّينِ\", \"وَمَا يُكَذِّبُ بِهِۦٓ إِلَّا كُلُّ مُعْتَدٍ أَثِيمٍ\", \"إِذَا تُتْلَىٰ عَلَيْهِ ءَايَٰتُنَا قَالَ أَسَٰطِيرُ ٱلْأَوَّلِينَ\", \"كَلَّاۖ بَلْۜ رَانَ عَلَىٰ قُلُوبِهِم مَّا كَانُواْ يَكْسِبُونَ\", \"كَلَّآ إِنَّهُمْ عَن رَّبِّهِمْ يَوْمَئِذٍ لَّمَحْجُوبُونَ\", \"ثُمَّ إِنَّهُمْ لَصَالُواْ ٱلْجَحِيمِ\", \"ثُمَّ يُقَالُ هَٰذَا ٱلَّذِي كُنتُم بِهِۦ تُكَذِّبُونَ\", \"كَلَّآ إِنَّ كِتَٰبَ ٱلْأَبْرَارِ لَفِي عِلِّيِّينَ\", \"وَمَآ أَدْرَىٰكَ مَا عِلِّيُّونَ\", \"كِتَٰبٌ مَّرْقُومٌ\", \"يَشْهَدُهُ ٱلْمُقَرَّبُونَ\", \"إِنَّ ٱلْأَبْرَارَ لَفِي نَعِيمٍ\", \"عَلَى ٱلْأَرَآئِكِ يَنظُرُونَ\", \"تَعْرِفُ فِي وُجُوهِهِمْ نَضْرَةَ ٱلنَّعِيمِ\", \"يُسْقَوْنَ مِن رَّحِيقٍ مَّخْتُومٍ\", \"خِتَٰمُهُۥ مِسْكٌۚ وَفِي ذَٰلِكَ فَلْيَتَنَافَسِ ٱلْمُتَنَٰفِسُونَ\", \"وَمِزَاجُهُۥ مِن تَسْنِيمٍ\", \"عَيْنًا يَشْرَبُ بِهَا ٱلْمُقَرَّبُونَ\", \"إِنَّ ٱلَّذِينَ أَجْرَمُواْ كَانُواْ مِنَ ٱلَّذِينَ ءَامَنُواْ يَضْحَكُونَ\", \"وَإِذَا مَرُّواْ بِهِمْ يَتَغَامَزُونَ\", \"وَإِذَا ٱنقَلَبُوٓاْ إِلَىٰٓ أَهْلِهِمُ ٱنقَلَبُواْ فَكِهِينَ\", \"وَإِذَا رَأَوْهُمْ قَالُوٓاْ إِنَّ هَٰٓؤُلَآءِ لَضَآلُّونَ\", \"وَمَآ أُرْسِلُواْ عَلَيْهِمْ حَٰفِظِينَ\", \"فَٱلْيَوْمَ ٱلَّذِينَ ءَامَنُواْ مِنَ ٱلْكُفَّارِ يَضْحَكُونَ\", \"عَلَى ٱلْأَرَآئِكِ يَنظُرُونَ\", \"هَلْ ثُوِّبَ ٱلْكُفَّارُ مَا كَانُواْ يَفْعَلُونَ\"], \"الانفطار\": [\"إِذَا ٱلسَّمَآءُ ٱنفَطَرَتْ\", \"وَإِذَا ٱلْكَوَاكِبُ ٱنتَثَرَتْ\", \"وَإِذَا ٱلْبِحَارُ فُجِّرَتْ\", \"وَإِذَا ٱلْقُبُورُ بُعْثِرَتْ\", \"عَلِمَتْ نَفْسٌ مَّا قَدَّمَتْ وَأَخَّرَتْ\", \"يَٰٓأَيُّهَا ٱلْإِنسَٰنُ مَا غَرَّكَ بِرَبِّكَ ٱلْكَرِيمِ\", \"ٱلَّذِي خَلَقَكَ فَسَوَّىٰكَ فَعَدَلَكَ\", \"فِيٓ أَيِّ صُورَةٍ مَّا شَآءَ رَكَّبَكَ\", \"كَلَّا بَلْ تُكَذِّبُونَ بِٱلدِّينِ\", \"وَإِنَّ عَلَيْكُمْ لَحَٰفِظِينَ\", \"كِرَامًا كَٰتِبِينَ\", \"يَعْلَمُونَ مَا تَفْعَلُونَ\", \"إِنَّ ٱلْأَبْرَارَ لَفِي نَعِيمٍ\", \"وَإِنَّ ٱلْفُجَّارَ لَفِي جَحِيمٍ\", \"يَصْلَوْنَهَا يَوْمَ ٱلدِّينِ\", \"وَمَا هُمْ عَنْهَا بِغَآئِبِينَ\", \"وَمَآ أَدْرَىٰكَ مَا يَوْمُ ٱلدِّينِ\", \"ثُمَّ مَآ أَدْرَىٰكَ مَا يَوْمُ ٱلدِّينِ\", \"يَوْمَ لَا تَمْلِكُ نَفْسٌ لِّنَفْسٍ شَيْـًٔاۖ وَٱلْأَمْرُ يَوْمَئِذٍ لِّلَّهِ\"], \"التكوير\": [\"إِذَا ٱلشَّمْسُ كُوِّرَتْ\", \"وَإِذَا ٱلنُّجُومُ ٱنكَدَرَتْ\", \"وَإِذَا ٱلْجِبَالُ سُيِّرَتْ\", \"وَإِذَا ٱلْعِشَارُ عُطِّلَتْ\", \"وَإِذَا ٱلْوُحُوشُ حُشِرَتْ\", \"وَإِذَا ٱلْبِحَارُ سُجِّرَتْ\", \"وَإِذَا ٱلنُّفُوسُ زُوِّجَتْ\", \"وَإِذَا ٱلْمَوْءُۥدَةُ سُئِلَتْ\", \"بِأَيِّ ذَنۢبٍ قُتِلَتْ\", \"وَإِذَا ٱلصُّحُفُ نُشِرَتْ\", \"وَإِذَا ٱلسَّمَآءُ كُشِطَتْ\", \"وَإِذَا ٱلْجَحِيمُ سُعِّرَتْ\", \"وَإِذَا ٱلْجَنَّةُ أُزْلِفَتْ\", \"عَلِمَتْ نَفْسٌ مَّآ أَحْضَرَتْ\", \"فَلَآ أُقْسِمُ بِٱلْخُنَّسِ\", \"ٱلْجَوَارِ ٱلْكُنَّسِ\", \"وَٱلَّيْلِ إِذَا عَسْعَسَ\", \"وَٱلصُّبْحِ إِذَا تَنَفَّسَ\", \"إِنَّهُۥ لَقَوْلُ رَسُولٍ كَرِيمٍ\", \"ذِي قُوَّةٍ عِندَ ذِي ٱلْعَرْشِ مَكِينٍ\", \"مُّطَاعٍ ثَمَّ أَمِينٍ\", \"وَمَا صَاحِبُكُم بِمَجْنُونٍ\", \"وَلَقَدْ رَءَاهُ بِٱلْأُفُقِ ٱلْمُبِينِ\", \"وَمَا هُوَ عَلَى ٱلْغَيْبِ بِضَنِينٍ\", \"وَمَا هُوَ بِقَوْلِ شَيْطَٰنٍ رَّجِيمٍ\", \"فَأَيْنَ تَذْهَبُونَ\", \"إِنْ هُوَ إِلَّا ذِكْرٌ لِّلْعَٰلَمِينَ\", \"لِمَن شَآءَ مِنكُمْ أَن يَسْتَقِيمَ\", \"وَمَا تَشَآءُونَ إِلَّآ أَن يَشَآءَ ٱللَّهُ رَبُّ ٱلْعَٰلَمِينَ\"], \"عبس\": [\"عَبَسَ وَتَوَلَّىٰٓ\", \"أَن جَآءَهُ ٱلْأَعْمَىٰ\", \"وَمَا يُدْرِيكَ لَعَلَّهُۥ يَزَّكَّىٰٓ\", \"أَوْ يَذَّكَّرُ فَتَنفَعَهُ ٱلذِّكْرَىٰٓ\", \"أَمَّا مَنِ ٱسْتَغْنَىٰ\", \"فَأَنتَ لَهُۥ تَصَدَّىٰ\", \"وَمَا عَلَيْكَ أَلَّا يَزَّكَّىٰ\", \"وَأَمَّا مَن جَآءَكَ يَسْعَىٰ\", \"وَهُوَ يَخْشَىٰ\", \"فَأَنتَ عَنْهُ تَلَهَّىٰ\", \"كَلَّآ إِنَّهَا تَذْكِرَةٌ\", \"فَمَن شَآءَ ذَكَرَهُۥ\", \"فِي صُحُفٍ مُّكَرَّمَةٍ\", \"مَّرْفُوعَةٍ مُّطَهَّرَةِۭ\", \"بِأَيْدِي سَفَرَةٍ\", \"كِرَامِۭ بَرَرَةٍ\", \"قُتِلَ ٱلْإِنسَٰنُ مَآ أَكْفَرَهُۥ\", \"مِنْ أَيِّ شَيْءٍ خَلَقَهُۥ\", \"مِن نُّطْفَةٍ خَلَقَهُۥ فَقَدَّرَهُۥ\", \"ثُمَّ ٱلسَّبِيلَ يَسَّرَهُۥ\", \"ثُمَّ أَمَاتَهُۥ فَأَقْبَرَهُۥ\", \"ثُمَّ إِذَا شَآءَ أَنشَرَهُۥ\", \"كَلَّا لَمَّا يَقْضِ مَآ أَمَرَهُۥ\", \"فَلْيَنظُرِ ٱلْإِنسَٰنُ إِلَىٰ طَعَامِهِۦٓ\", \"أَنَّا صَبَبْنَا ٱلْمَآءَ صَبًّا\", \"ثُمَّ شَقَقْنَا ٱلْأَرْضَ شَقًّا\", \"فَأَنۢبَتْنَا فِيهَا حَبًّا\", \"وَعِنَبًا وَقَضْبًا\", \"وَزَيْتُونًا وَنَخْلًا\", \"وَحَدَآئِقَ غُلْبًا\", \"وَفَٰكِهَةً وَأَبًّا\", \"مَّتَٰعًا لَّكُمْ وَلِأَنْعَٰمِكُمْ\", \"فَإِذَا جَآءَتِ ٱلصَّآخَّةُ\", \"يَوْمَ يَفِرُّ ٱلْمَرْءُ مِنْ أَخِيهِ\", \"وَأُمِّهِۦ وَأَبِيهِ\", \"وَصَٰحِبَتِهِۦ وَبَنِيهِ\", \"لِكُلِّ ٱمْرِيٍٕ مِّنْهُمْ يَوْمَئِذٍ شَأْنٌ يُغْنِيهِ\", \"وُجُوهٌ يَوْمَئِذٍ مُّسْفِرَةٌ\", \"ضَاحِكَةٌ مُّسْتَبْشِرَةٌ\", \"وَوُجُوهٌ يَوْمَئِذٍ عَلَيْهَا غَبَرَةٌ\", \"تَرْهَقُهَا قَتَرَةٌ\", \"أُوْلَٰٓئِكَ هُمُ ٱلْكَفَرَةُ ٱلْفَجَرَةُ\"], \"النازعات\": [\"وَٱلنَّٰزِعَٰتِ غَرْقًا\", \"وَٱلنَّٰشِطَٰتِ نَشْطًا\", \"وَٱلسَّٰبِحَٰتِ سَبْحًا\", \"فَٱلسَّٰبِقَٰتِ سَبْقًا\", \"فَٱلْمُدَبِّرَٰتِ أَمْرًا\", \"يَوْمَ تَرْجُفُ ٱلرَّاجِفَةُ\", \"تَتْبَعُهَا ٱلرَّادِفَةُ\", \"قُلُوبٌ يَوْمَئِذٍ وَاجِفَةٌ\", \"أَبْصَٰرُهَا خَٰشِعَةٌ\", \"يَقُولُونَ أَءِنَّا لَمَرْدُودُونَ فِي ٱلْحَافِرَةِ\", \"أَءِذَا كُنَّا عِظَٰمًا نَّخِرَةً\", \"قَالُواْ تِلْكَ إِذًا كَرَّةٌ خَاسِرَةٌ\", \"فَإِنَّمَا هِيَ زَجْرَةٌ وَٰحِدَةٌ\", \"فَإِذَا هُم بِٱلسَّاهِرَةِ\", \"هَلْ أَتَىٰكَ حَدِيثُ مُوسَىٰٓ\", \"إِذْ نَادَىٰهُ رَبُّهُۥ بِٱلْوَادِ ٱلْمُقَدَّسِ طُوًى\", \"ٱذْهَبْ إِلَىٰ فِرْعَوْنَ إِنَّهُۥ طَغَىٰ\", \"فَقُلْ هَل لَّكَ إِلَىٰٓ أَن تَزَكَّىٰ\", \"وَأَهْدِيَكَ إِلَىٰ رَبِّكَ فَتَخْشَىٰ\", \"فَأَرَىٰهُ ٱلْأٓيَةَ ٱلْكُبْرَىٰ\", \"فَكَذَّبَ وَعَصَىٰ\", \"ثُمَّ أَدْبَرَ يَسْعَىٰ\", \"فَحَشَرَ فَنَادَىٰ\", \"فَقَالَ أَنَا۠ رَبُّكُمُ ٱلْأَعْلَىٰ\", \"فَأَخَذَهُ ٱللَّهُ نَكَالَ ٱلْأٓخِرَةِ وَٱلْأُولَىٰٓ\", \"إِنَّ فِي ذَٰلِكَ لَعِبْرَةً لِّمَن يَخْشَىٰٓ\", \"ءَأَنتُمْ أَشَدُّ خَلْقًا أَمِ ٱلسَّمَآءُۚ بَنَىٰهَا\", \"رَفَعَ سَمْكَهَا فَسَوَّىٰهَا\", \"وَأَغْطَشَ لَيْلَهَا وَأَخْرَجَ ضُحَىٰهَا\", \"وَٱلْأَرْضَ بَعْدَ ذَٰلِكَ دَحَىٰهَآ\", \"أَخْرَجَ مِنْهَا مَآءَهَا وَمَرْعَىٰهَا\", \"وَٱلْجِبَالَ أَرْسَىٰهَا\", \"مَتَٰعًا لَّكُمْ وَلِأَنْعَٰمِكُمْ\", \"فَإِذَا جَآءَتِ ٱلطَّآمَّةُ ٱلْكُبْرَىٰ\", \"يَوْمَ يَتَذَكَّرُ ٱلْإِنسَٰنُ مَا سَعَىٰ\", \"وَبُرِّزَتِ ٱلْجَحِيمُ لِمَن يَرَىٰ\", \"فَأَمَّا مَن طَغَىٰ\", \"وَءَاثَرَ ٱلْحَيَوٰةَ ٱلدُّنْيَا\", \"فَإِنَّ ٱلْجَحِيمَ هِيَ ٱلْمَأْوَىٰ\", \"وَأَمَّا مَنْ خَافَ مَقَامَ رَبِّهِۦ وَنَهَى ٱلنَّفْسَ عَنِ ٱلْهَوَىٰ\", \"فَإِنَّ ٱلْجَنَّةَ هِ ';\n order.filter(i=>!picked.includes(i)).forEach((i,k)=>p.appendChild(chip(words[i],i,()=>{if(done)return;picked.push(i);draw();check();},k)));\n}\nfunction check(){\n if(picked.length<words.length)return;\n const ok=picked.every((w,k)=>words[w]===words[k]);\n const box=$('answer');\n if(ok){\n  done=true;streak++;solved++;pts+=10+Math.min(streak-1,5)*2;\n  box.className='box win';\n  const last=idx===DATA[cur].length-1;\n  confetti(last?120:50);\n  if(last){$('stars').innerHTML='<div class=\"trophy\">🏆<\/div>';say('ما شاء الله! أتممت سورة '+cur+' 🎊','var(--ok)');}\n  else say(streak>=3?'سلسلة رائعة: '+streak+' آيات متتالية! 🔥':rnd(GOOD),'var(--ok)');\n  $('score').textContent='⭐ '+pts;$('streak').textContent='🔥 '+streak;$('fill').style.width=(solved/DATA[cur].length*100)+'%';\n }else{\n  streak=0;box.className='box bad';say(rnd(BAD),'var(--err)');\n  setTimeout(()=>{picked=[];box.className='box';draw();},1200);\n }\n}\n$('reset').onclick=()=>{picked=[];done=false;$('msg').textContent='';$('answer').className='box';draw();};\n$('next').onclick=()=>{if(!done){say('رتّب الآية أولاً 😊','var(--sub)');return;}\n if(idx<DATA[cur].length-1){idx++;}else{idx=0;pts=0;solved=0;}load();};\ndocument.body.classList.add('nogame');tabs();\n<\/script>\n<\/body>\n<\/html>\n",a:"<!DOCTYPE html>\n<html lang=\"ar\" dir=\"rtl\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>لعبة أسماء الله الحسنى<\/title>\n<style>\n:root{--bg:#f3fbf6;--card:#e0f5e8;--text:#1f2d26;--sub:#4a6b58;--border:#8fd3a8;--ok:#2e9e5b;--err:#e24b4a;--accent:#0c8599;--white:#fff;\nbox-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}\n@media (prefers-color-scheme:dark){:root:not([data-theme=\"light\"]){--bg:#14201a;--card:#1f3329;--text:#eafaf0;--sub:#a9d3ba;--border:#3f7a58;--ok:#5fd68c;--err:#ff8a89;--accent:#4fd1e8;--white:#10201a}}\n:root[data-theme=\"dark\"]{--bg:#14 ;\nconst GRP=[[0, 1, 82, 78], [13, 33, 81, 79], [31, 98], [35, 77, 36, 9, 32, 40], [10, 11, 12, 94, 57], [65, 66], [52, 53, 68, 69, 14], [64, 47], [37, 42, 6, 49, 39], [28, 85, 27], [87, 88], [54, 76, 51], [59, 61], [16, 38], [62, 63], [93, 97], [86, 48, 58], [83, 2], [30, 18]];\nconst PER=10, LV=Math.ceil(N.length/PER);\nconst GOOD=[\"ما شاء الله، أحسنت! 🌟\",\"بارك الله فيك! 👏\",\"ممتاز! 🎉\",\"أنت بطل! 💪\",\"رائع جداً! 🚀\",\"ما شاء الله تبارك الله! ✨\"];\nconst BAD=[\"لا بأس، أنت تتعلم! 🌱\",\"قريب جداً، ركّز في المرة القادمة 💛\",\"تذكّر الجواب وسنكمل 📖\"];\nconst COLORS=[\"#e8590c\",\"#2f9e44\",\"#1c7ed6\",\"#ae3ec9\",\"#d6336c\",\"#0c8599\",\"#f08c00\",\"#5f3dc4\"];\nconst $=id=>document.getElementById(id), rnd=a=>a[Math.floor(Math.random()*a.length)];\nfunction shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}\nlet best=Array(LV).fill(0);\ntry{const s=JSON.parse(localStorage.getItem('asma_best')||'[]');if(Array.isArray(s))best=best.map((x,i)=>+s[i]||0);}catch(e){}\nfunction save(){try{localStorage.setItem('asma_best',JSON.stringify(best));}catch(e){}}\nfunction confetti(n){for(let i=0;i<n;i++){const c=document.createElement('div');c.className='cf';c.style.left=Math.random()*100+'vw';c.style.background=rnd(COLORS);c.style.animationDuration=(1.8+Math.random()*1.8)+'s';c.style.animationDelay=Math.random()*.4+'s';c.style.borderRadius=Math.random()>.5?'50%':'2px';document.body.appendChild(c);setTimeout(()=>c.remove(),4200);}}\nfunction say(t,color){const m=$('msg');if(!m)return;m.textContent=t;m.style.color=color;m.classList.remove('show');void m.offsetWidth;m.classList.add('show');}\nfunction items(l){return N.slice(l*PER,l*PER+PER);}\n\nfunction home(){\n let h='<div class=\"grid\">';\n for(let l=0;l<LV;l++){\n  const it=items(l);\n  h+='<div class=\"lvl\" style=\"animation-delay:'+l*0.08+'s\"><b>المستوى '+(l+1)+'<\/b><small>'+it[0][0]+' ... '+it[it.length-1][0]+'<\/small><div class=\"st\">'+('⭐'.repeat(best[l])+'☆'.repeat(3-best[l]))+'<\/div><div class=\"row\" style=\"margin-top:8px\"><button class=\"sec\" onclick=\"learn('+l+')\">تعلّم<\/button><button class=\"pri\" onclick=\"quiz('+l+')\">اختبر<\/button><\/div><\/div>';\n }\n h+='<\/div><p style=\"text-align:center;color:var(--sub);margin-top:16px\">أسماء الله الحسنى التسعة والتسعون في '+LV+' مستويات. تعلّم أولاً ثم اختبر نفسك.<\/p>';\n $('app').innerHTML=h;\n}\n\nfunction learn(l,i){\n i=i||0;const it=items(l),d=it[i];\n $('app').innerHTML='<div class=\"top\"><span class=\"pill\">المستوى '+(l+1)+'<\/span><span class=\"pill\">'+(i+1)+' / '+it.length+'<\/span><\/div><div class=\"bar\"><i style=\"width:'+((i+1)/it.length*100)+'%\"><\/i><\/div><div class=\"big\"><div class=\"nm\">'+d[0]+'<\/div><div class=\"mn\">'+d[1]+'<\/div><\/div><div class=\"row\"><button '+(i?'':'style=\"visibility:hidden\"')+' onclick=\"learn('+l+','+(i-1)+')\">➡ السابق<\/button>'+(i<it.length-1?'<button class=\"pri\" onclick=\"learn('+l+','+(i+1)+')\">التالي ⬅<\/button>':'<button class=\"pri\" onclick=\"quiz('+l+')\">ابدأ الاختبار 🚀<\/button>')+'<\/div><div class=\"row\" style=\"margin-top:10px\"><button onclick=\"home()\">🏠 الرئيسية<\/button><\/div>';\n}\n\nlet Q=null;\nfunction quiz(l){\n const it=items(l);\n Q={l,n:it.length,qs:shuffle(it.map((x,k)=>k)).map((k,n)=>({k,rev:n%2===1})),i:0,pts:0,streak:0,lock:false};\n ask();\n}\nfunction ask(){\n const it=items(Q.l),q=Q.qs[Q.i],d=it[q.k];\n const gi=N.indexOf(d),grp=GRP.find(g=>g.includes(gi))||[gi];const pool=N.filter((x,k)=>!grp.includes(k));\n const others=shuffle(pool).slice(0,2);\n const opts=shuffle([d].concat(others));\n Q.cur={ans:d[0],opts};Q.lock=false;\n const prompt=q.rev?'<div class=\"q\">ما الاسم الذي معناه:<\/div><div class=\"mn\">'+d[1]+'<\/div>':'<div class=\"q\">ما معنى هذا الاسم؟<\/div><div class=\"nm\">'+d[0]+'<\/div>';\n let h='<div class=\"top\"><span class=\"pill\">📖 '+(Q.i+1)+' / '+Q.n+'<\/span><span class=\"pill\">🔥 '+Q.streak+'<\/span><span class=\"pill\">⭐ '+Q.pts+'<\/span><\/div><div class=\"bar\"><i style=\"width:'+(Q.i/Q.n*100)+'%\"><\/i><\/div><div class=\"big\">'+prompt+'<\/div><div class=\"opts\">';\n opts.forEach((o,n)=>{h+='<button class=\"opt'+(q.rev?' nm':'')+'\" style=\"animation-delay:'+n*0.07+'s\" data-n=\"'+o[0]+'\" onclick=\"pick(this)\">'+(q.rev?o[0]:o[1])+'<\/button>';});\n h+='<\/div><div id=\"msg\"><\/div>';\n $('app').innerHTML=h;\n}\nfunction pick(b){\n if(Q.lock)return;Q.lock=true;\n const ok=b.dataset.n===Q.cur.ans;\n if(ok){b.classList.add('good');Q.streak++;Q.pts+=10+Math.min(Q.streak-1,5)*2;confetti(25);say(Q.streak>=3?'سلسلة رائعة: '+Q.streak+' 🔥':rnd(GOOD),'var(--ok)');}\n else{b.classList.add('bad');Q.streak=0;document.querySelectorAll('.opt').forEach(x=>{if(x.dataset.n===Q.cur.ans)x.classList.add('good');});say(rnd(BAD),'var(--err)');}\n if(ok)Q.right=(Q.right||0)+1;\n setTimeout(()=>{Q.i++;if(Q.i<Q.n)ask();else finish();},1400);\n}\nfunction finish(){\n const r=Q.right||0,pc=r/Q.n,s=pc>=0.9?3:pc>=0.7?2:pc>=0.5?1:0;\n if(s>best[Q.l]){best[Q.l]=s;save();}\n if(s>=2)confetti(140);\n const msg=s===3?'ما شاء الله! حفظتَ المستوى كاملاً':s===2?'أحسنت! تقريباً أتقنتَ المستوى':s===1?'بداية جميلة، راجع وحاول مرة أخرى':'لا بأس، تعلّم مرة أخرى وستنجح';\n $('app').innerHTML='<div class=\"res\"><div class=\"e\">'+(s>=2?'🏆':'🌱')+'<\/div><h2>'+r+' من '+Q.n+'<\/h2><div class=\"s\">'+('⭐'.repeat(s)+'☆'.repeat(3-s))+'<\/div><p style=\"font-size:19px;font-weight:600\">'+msg+'<\/p><p>نقاطك: '+Q.pts+'<\/p><\/div><div class=\"row\"><button class=\"pri\" onclick=\"quiz('+Q.l+')\">🔄 اختبار جديد<\/button><button class=\"sec\" onclick=\"learn('+Q.l+')\">📖 تعلّم<\/button><\/div><div class=\"row\" style=\"margin-top:10px\">'+(Q.l<LV-1?'<button onclick=\"learn('+(Q.l+1)+')\">المستوى التالي ⬅<\/button>':'')+'<button onclick=\"home()\">🏠 الرئيسية<\/button><\/div>';\n}\nhome();\n<\/script>\n<\/body>\n<\/html>\n",p:"<!DOCTYPE html>\n<html lang=\"ar\" dir=\"rtl\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>لعبة الأنبياء<\/title>\n<style>\n:root{--bg:#fff7ec;--card:#ffe9cc;--text:#2c2a26;--sub:#7a5a30;--border:#f0b36a;--ok:#2e9e5b;--err:#e24b4a;--accent:#d9480f;--white:#fff;\nbox-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}\n@media (prefers-color-scheme:dark){:root:not([data-theme=\"light\"]){--bg:#251a12;--card:#3a2a1c;--text:#fbeede;--sub:#e0c19a;--border:#8a5a2c;--ok:#5fd68c;--err:#ff8a89;--accent:#ff9b5c;--white:#251a12}}\n:root[data-theme=\"dark\"]{--bg:#251a12;--card:#3a2a1c;--text:#fbeede;--sub:#e0c19a;--border:#8a5a2c;--ok:#5fd68c;--err:#ff8a89;--accent:#ff9b5c;--white:#251a12}\n*{box-sizing:border-box}\nbody{margin:0;background:var(--bg);color:var(--text);font-family:\"Segoe UI\",Tahoma,Arial,sans-serif;overflow-x:hidden}\nmain{max-width:560px;margin:0 auto;padding:16px}\nh1{font-size:24px;font-weight:600;margin:0 0 12px;text-align:center;color:var(--accent)}\nbutton{font:inherit;color:var(--text);background:transparent;border:2px solid var(--border);border-radius:14px;padding:10px 14px;cursor:pointer;transition:transform .12s}\nbutton:active{transform:scale(.95)}\n.rand{display:block;width:100%;font-size:20px;font-weight:600;background:var(--accent);border-color:var(--accent);color:var(--white);padding:16px;margin-bottom:14px;animation:pop .4s}\n.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}\n.pr{background:var(--card);padding:10px 4px;text-align:center;animation:pop .4s backwards}\n.pr .em{font-size:28px;display:block}\n.pr b{display:block;font-size:16px}\n.pr small{display:block;font-size:12px;min-height:16px}\n.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px;font-size:15px}\n.pill{background:var(--card);border-radius:999px;padding:5px 12px;font-weight:600}\n.bar{height:12px;background:var(--card);border-radius:999px;overflow:hidden;margin-bottom:14px}\n.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff9f1c,#ffd23f,#2ec4b6);border-radius:999px;transition:width .5s}\n.big{background:var(--card);border:2px solid var(--border);border-radius:22px;padding:18px 14px;text-align:center;margin-bottom:14px;min-height:130px;display:flex;flex-direction:column;justify-content:center;gap:8px;animation:pop .4s}\n.big .who{font-size:15px;color:var(--accent);font-weight:600}\n.big .qq{font-size:22px;line-height:1.7;font-weight:600}\n.opts{display:grid;gap:10px;margin-bottom:12px}\n.opt{font-size:19px;line-height:1.6;padding:10px 14px;background:var(--card);animation:pop .35s backwards}\n.opt.good{background:var(--ok);border-color:var(--ok);color:#fff;animation:bounce .6s}\n.opt.bad{background:var(--err);border-color:var(--err);color:#fff;animation:shake .4s}\n#msg{min-height:34px;font-size:19px;font-weight:600;text-align:center;margin-bottom:10px}\n#msg.show{animation:bounce .6s}\n.row{display:flex;gap:8px}.row button{flex:1;font-weight:600}\n.pri{background:var(--ok);border-color:var(--ok);color:#fff}\n.sec{background:var(--accent);border-color:var(--accent);color:var(--white)}\n.res{text-align:center;animation:pop .5s}\n.res .e{font-size:64px;animation:bounce 1s infinite}\n.res .s{font-size:34px;letter-spacing:6px;margin:6px 0}\n.cf{position:fixed;top:-20px;width:10px;height:14px;z-index:9;pointer-events:none;animation:fall linear forwards}\n@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.07)}100%{transform:scale(1);opacity:1}}\n@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}\n@keyframes bounce{0%,100%{transform:translateY(0)}30%{transform:translateY(-12px)}60%{transform:translateY(0)}80%{transform:translateY(-5px)}}\n@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:.9}}\n@media (prefers-reduced-motion:reduce){*{animation:none!important}}\n<\/style>\n<\/head>\n<body>\n<main>\n<section>\n<h1>🕌 أسئلة عن الأنبياء ⭐<\/h1>\n<div id=\"app\"><\/div>\n<\/section>\n<\/main>\n<script>\nconst P=[{\"n\": \"آدم\", \"e\": \"🌱\", \"q\": [[\"من أي مادة خلق الله آدم؟\", \"من طين\", \"من نور\", \"من نار\"], [\"من الذي رفض السجود لآدم؟\", \"إبليس\", \"جبريل\", \"ميكائيل\"], [\"ما اسم زوجة آدم؟\", \"حواء\", \"مريم\", \"سارة\"], [\"أين أسكن الله آدم وزوجه في البداية؟\", \"في الجنة\", \"في الأرض\", \"في جبل\"], [\"ماذا علّم الله آدم؟\", \"الأسماء كلها\", \"الحدادة\", \"الزراعة\"], [\"من الذي وسوس لآدم وزوجه؟\", \"الشيطان\", \"جبريل\", \"الغراب\"], [\"عن أي شيء نهى الله آدم وزوجه؟\", \"الأكل من الشجرة\", \"شرب الماء\", \"المشي في الجنة\"], [\"كيف تاب آدم إلى ربه؟\", \"تلقّى من ربه كلمات فتاب عليه\", \"قاتل الشيطان\", \"هاجر إلى جبل\"], [\"ماذا أمر الله الملائكة أن يفعلوا لآدم؟\", \"أن يسجدوا له\", \"أن يخدموه\", \"أن يحرسوه\"], [\"إلى أين أُنزل آدم من الجنة؟\", \"إلى الأرض\", \"إلى السماء\", \"إلى البحر\"]]}, {\"n\": \"إدريس\", \"e\": \"📜\", \"q\": [[\"بماذا وصفه الله في القرآن؟\", \"صدّيقاً نبياً\", \"ملكاً\", \"تاجراً\"], [\"ماذا قال الله عنه: «ورفعناه ...»؟\", \"مكاناً علياً\", \"فوق الجبال\", \"إلى البحر\"], [\"في أي سورتين ذُكر اسم إدريس؟\", \"مريم والأنبياء\", \"البقرة وآل عمران\", \"يوسف وهود\"], [\"مع من ذُكر إدريس من الصابرين في سورة الأنبياء؟\", \"إسماعيل وذو الكفل\", \"موسى وهارون\", \"آدم ونوح\"], [\"في سورة مريم ذُكر إدريس بعد أي نبي؟\", \"إسماعيل\", \"موسى\", \"هارون\"], [\"ما معنى كلمة «صدّيق»؟\", \"كثير الصدق\", \"كثير المال\", \"كثير السفر\"], [\"هل ورد في القرآن ذكر كتاب أُنزل على إدريس؟\", \"لا، لم يرد ذكر ذلك\", \"نعم، الزبور\", \"نعم، التوراة\"], [\"كم مرة ذُكر اسم إدريس في القرآن؟\", \"مرتين\", \"عشر مرات\", \"مرة واحدة\"], [\"في أي سورة جاء: «واذكر في الكتاب إدريس»؟\", \"سورة مريم\", \"سورة الكهف\", \"سورة الأنفال\"], [\"هل ورد في القرآن أن إدريس كان يعمل بالخياطة؟\", \"لا، لم يرد ذلك\", \"نعم\", \"ورد أنه كان حداداً\"]]}, {\"n\": \"نوح\", \"e\": \"🚢\", \"q\": [[\"ماذا أمر الله نوحاً أن يصنع؟\", \"السفينة\", \"قصراً\", \"سدّاً\"], [\"كم لبث نوح في قومه يدعوهم؟\", \"ألف سنة إلا خمسين عاماً\", \"مئة سنة\", \"عشر سنين\"], [\"من الذي رفض الركوب مع نوح فغرق؟\", \"ابنه\", \"أخوه\", \"صديقه\"], [\"على أي جبل استقرّت السفينة؟\", \"الجودي\", \"أُحد\", \"سيناء\"], [\"ماذا فار حين جاء أمر الله بالطوفان؟\", \"التنّور\", \"الجبل\", \"النهر الصغير\"], [\"كم حمل نوح من كل زوجين في السفينة؟\", \"اثنين\", \"واحداً\", \"أربعة\"], [\"ماذا قال الله للأرض والسماء بعد الطوفان؟\", \"ابلعي ماءك وأقلعي\", \"اسكني\", \"انشقي\"], [\"كيف دعا نوح قومه؟\", \"ليلاً ونهاراً وسراً وجهراً\", \"مرة واحدة فقط\", \"في الشتاء فقط\"], [\"ماذا قال نوح لقومه: «استغفروا ربكم إنه كان ...»؟\", \"غفّاراً\", \"منتقماً\", \"جباراً\"], [\"كيف نظر قوم نوح إلى سفينته وهو يصنعها؟\", \"سخروا منه\", \"ساعدوه\", \"خافوا منها\"]]}, {\"n\": \"هود\", \"e\": \"🌪️\", \"q\": [[\"إلى أي قوم أُرسل هود؟\", \"قوم عاد\", \"قوم ثمود\", \"قوم مدين\"], [\"بماذا أُهلك قوم عاد؟\", \"ريح صرصر عاتية\", \"الطوفان\", \"الصيحة\"], [\"أي سورة في القرآن سُميت باسم هود؟\", \"سورة هود\", \"سورة يوسف\", \"سورة الكهف\"], [\"بماذا اشتهر قوم عاد؟\", \"قوة أجسامهم وبناء الأبنية العالية\", \"صناعة السفن\", \"التجارة في البحر\"], [\"ما اسم المكان الذي سكنه قوم عاد؟\", \"الأحقاف\", \"الحِجر\", \"الطور\"], [\"بماذا اغترّ قوم عاد؟\", \"قوتهم\", \"علمهم\", \"تجارتهم\"], [\"كم ليلة سلّط الله عليهم الريح؟\", \"سبع ليال وثمانية أيام\", \"ثلاثة أيام\", \"أربعين يوماً\"], [\"هود أخو عاد، أي أنه؟\", \"من قومهم\", \"من أهل مصر\", \"من الجن\"], [\"ماذا وعد هود قومه إن استغفروا؟\", \"يرسل السماء عليهم مدراراً\", \"يعطيهم الذهب\", \"ينقلهم لبلد آخر\"], [\"ماذا قال قوم عاد: «من أشدّ منا ...»؟\", \"قوة\", \"علماً\", \"مالاً\"]]}, {\"n\": \"صالح\", \"e\": \"🐪\", \"q\": [[\"إلى أي قوم أُرسل صالح؟\", \"ثمود\", \"عاد\", \"مدين\"], [\"ما معجزة صالح؟\", \"الناقة\", \"العصا\", \"السفينة\"], [\"ماذا فعل قومه بالناقة؟\", \"عقروها\", \"عبدوها\", \"هربوا بها\"], [\"بماذا أُهلك قوم ثمود؟\", \"الصيحة\", \"الطوفان\", \"الجراد\"], [\"ماذا قال صالح عن الناقة؟\", \"ناقة الله لكم آية\", \"ناقة من ذهب\", \"ناقة تطي argin:0;background:var(--bg);color:var(--text);font-family:\"Segoe UI\",Tahoma,Arial,sans-serif;overflow-x:hidden}\nmain{max-width:560px;margin:0 auto;padding:16px}\nh1{font-size:24px;font-weight:600;margin:0 0 12px;text-align:center;color:var(--accent)}\nbutton{font:inherit;color:var(--text);background:transparent;border:2px solid var(--border);border-radius:14px;padding:10px 14px;cursor:pointer;transition:transform .12s}\nbutton:active{transform:scale(.95)}\n.rand{display:block;width:100%;font-size:20px;font-weight:600;background:var(--accent);border-color:var(--accent);color:var(--white);padding:16px;margin-bottom:14px;animation:pop .4s}\n.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}\n.pr{background:var(--card);padding:10px 4px;text-align:center;animation:pop .4s backwards}\n.pr .em{font-size:28px;display:block}\n.pr b{display:block;font-size:16px}\n.pr small{display:block;font-size:12px;min-height:16px}\n.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px;font-size:15px}\n.pill{background:var(--card);border-radius:999px;padding:5px 12px;font-weight:600}\n.bar{height:12px;background:var(--card);border-radius:999px;overflow:hidden;margin-bottom:14px}\n.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff9f1c,#ffd23f,#2ec4b6);border-radius:999px;transition:width .5s}\n.big{background:var(--card);border:2px solid var(--border);border-radius:22px;padding:18px 14px;text-align:center;margin-bottom:14px;min-height:130px;display:flex;flex-direction:column;justify-content:center;gap:8px;animation:pop .4s}\n.big .who{font-size:15px;color:var(--accent);font-weight:600}\n.big .qq{font-size:22px;line-height:1.7;font-weight:600}\n.opts{display:grid;gap:10px;margin-bottom:12px}\n.opt{font-size:19px;line-height:1.6;padding:10px 14px;background:var(--card);animation:pop .35s backwards}\n.opt.good{background:var(--ok);border-color:var(--ok);color:#fff;animation:bounce .6s}\n.opt.bad{background:var(--err);border-color:var(--err);color:#fff;animation:shake .4s}\n#msg{min-height:34px;font-size:19px;font-weight:600;text-align:center;margin-bottom:10px}\n#msg.show{animation:bounce .6s}\n.row{display:flex;gap:8px}.row button{flex:1;font-weight:600}\n.pri{background:var(--ok);border-color:var(--ok);color:#fff}\n.sec{background:var(--accent);border-color:var(--accent);color:var(--white)}\n.res{text-align:center;animation:pop .5s}\n.res .e{font-size:64px;animation:bounce 1s infinite}\n.res .s{font-size:34px;letter-spacing:6px;margin:6px 0}\n.cf{position:fixed;top:-20px;width:10px;height:14px;z-index:9;pointer-events:none;animation:fall linear forwards}\n@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.07)}100%{transform:scale(1);opacity:1}}\n@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}\n@keyframes bounce{0%,100%{transform:translateY(0)}30%{transform:translateY(-12px)}60%{transform:translateY(0)}80%{transform:translateY(-5px)}}\n@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:.9}}\n@media (prefers-reduced-motion:reduce){*{animation:none!important}}\n<\/style>\n<\/head>\n<body>\n<main>\n<section>\n<h1>📗 أسئلة سورة الكهف ⭐<\/h1>\n<div id=\"app\"><\/div>\n<\/section>\n<\/main>\n<script>\nconst P=[{\"n\": \"عن السورة\", \"e\": \"📗\", \"q\": [[\"كم عدد آيات سورة الكهف؟\", \"110 آيات\", \"99 آية\", \"120 آية\"], [\"ما ترتيب سورة الكهف في المصحف؟\", \"الثامنة عشرة\", \"العاشرة\", \"الثلاثون\"], [\"سورة الكهف مكية أم مدنية؟\", \"مكية\", \"مدنية\", \"نصفها مكي ونصفها مدني\"], [\"لماذا سُميت سورة الكهف بهذا الاسم؟\", \"لقصة أصحاب الكهف فيها\", \"لأنها نزلت في كهف\", \"لأن فيها وصف الجبال\"], [\"أي القصص التالية ليست في سورة الكهف؟\", \"قصة يوسف\", \"قصة أصحاب الكهف\", \"قصة ذي القرنين\"], [\"ما أول قصة في سورة الكهف؟\", \"أصحاب الكهف\", \"موسى والخضر\", \"ذو القرنين\"], [\"ما القصة الأخيرة في سورة الكهف؟\", \"ذو القرنين\", \"موسى والخضر\", \"صاحب الجنتين\"], [\"بأي عبارة تبدأ سورة الكهف؟\", \"«الحمد لله»\", \"«قل أعوذ»\", \"«تبارك الذي»\"], [\"في أي جزء من القرآن تبدأ سورة الكهف؟\", \"الجزء الخامس عشر\", \"الجزء الأول\", \"الجزء الثلاثون\"], [\"كم قصة رئيسية في سورة الكهف؟\", \"أربع قصص\", \"ثلاث قصص\", \"سبع قصص\"]]}, {\"n\": \"مقدمة السورة\", \"e\": \"🌟\", \"q\": [[\"ماذا قال الله: «ولم يجعل له ...»؟ (آية 1)\", \"عِوَجاً\", \"شكّاً\", \"ظلماً\"], [\"لماذا جعل الله ما على الأرض زينة لها؟ (آية 7)\", \"ليبلوهم أيهم أحسن عملاً\", \"ليلهيهم\", \"ليخيفهم\"], [\"ماذا سيجعل الله ما على الأرض في النهاية؟ (آية 8)\", \"صعيداً جُرزاً\", \"جنة خضراء\", \"بحراً\"], [\"ما معنى «باخع نفسك»؟ (آية 6)\", \"مُهلك نفسك حزناً\", \"مُسعد نفسك\", \"مُغضب نفسك\"], [\"من الذين لهم أجر حسن ماكثين فيه أبداً؟ (آية 2)\", \"المؤمنون الذين يعملون الصالحات\", \"الملوك\", \"المسافرون\"], [\"من الذين أُنذروا في بداية السورة؟ (آية 4)\", \"الذين قالوا اتخذ الله ولداً\", \"الذين يكذبون بالبعث\", \"الذين يعبدون النجوم\"], [\"ماذا وصف الله به قولهم «اتخذ الله ولداً»؟ (آية 5)\", \"كبُرت كلمةً تخرج من أفواههم\", \"كلمة صادقة\", \"كلمة جميلة\"], [\"ما الذي يُبشَّر به المؤمنون في أول السورة؟ (آية 2)\", \"أجر حسن\", \"ملك الأرض\", \"طول العمر\"]]}, {\"n\": \"أصحاب الكهف\", \"e\": \"🕳️\", \"q\": [[\"ماذا سُمّي الذين أووا إلى الكهف؟ (آية 10)\", \"الفتية\", \"الشيوخ\", \"التجار\"], [\"ماذا قال الفتية حين أووا إلى الكهف؟ (آية 10)\", \"ربنا آتنا من لدنك رحمة وهيّئ لنا من أمرنا رشداً\", \"ربنا آتنا في الدنيا حسنة\", \"ربنا اغفر لنا ذنوبنا\"], [\"ماذا فعل الله بهم في الكهف؟ (آية 11)\", \"ضرب على آذانهم سنين عدداً\", \"أحرق الكهف\", \"أخرجهم منه\"], [\"كم لبث أصحاب الكهف في كهفهم؟ (آية 25)\", \"ثلاثمئة سنة وازدادوا تسعاً\", \"مئة سنة\", \"ألف سنة\"], [\"ماذا كان عند باب الكهف؟ (آية 18)\", \"كلبهم باسط ذراعيه بالوصيد\", \"أسد\", \"حارس\"], [\"بماذا أرسلوا أحدهم إلى المدينة؟ (آية 19)\", \"بورِقهم (نقودهم الفضية)\", \"بسيف\", \"برسالة مكتوبة\"], [\"ماذا طلبوا ممن يذهب إلى المدينة؟ (آية 19)\", \"أن ينظر أيها أزكى طعاماً\", \"أن يشتري ثياباً\", \"أن يسأل عن الملك\"], [\"ماذا قال بعضهم حين سُئلوا كم لبثتم؟ (آية 19)\", \"لبثنا يوماً أو بعض يوم\", \"لبثنا سنة\", \"لبثنا ألف عام\"], [\"ماذا قال الذين غلبوا على أمرهم عند اكتشافهم؟ (آية 21)\", \"لنتخذن عليهم مسجداً\", \"لنحرقنّهم\", \"لنطردنّهم\"], [\"ماذا أمر الله نبيّه أن يقول عن عدد أصحاب الكهف؟ (آية 22)\", \"ربي أعلم بعدّتهم\", \"هم سبعة بلا شك\", \"هم ثلاثة بلا شك\"]]}, {\"n\": \"توجيهات ووعد ووعيد\", \"e\": \"🧭\", \"q\": [[\"ماذا نقول إذا قلنا إنا سنفعل شيئاً غداً؟ (آية 24)\", \"إن شاء الله\", \"لا قوة إلا بالله\", \"الحمد لله\"], [\"ماذا قال الله عن كلماته؟ (آية 27)\", \"لا مبدّل لكلماته\", \"تتغير بالزمن\", \"تُنسخ كلها\"], [\"مع من أُمر النبي ﷺ أن يصبر نفسه؟ (آية 28)\", \"الذين يدعون ربهم بالغداة والعشي يريدون وجهه\", \"الملوك\", \"الأغنياء\"], [\"ماذا قال الله: «وقل الحق من ربكم فمن شاء ...»؟ (آية 29)\", \"فليؤمن ومن شاء فليكفر\", \"فليسافر\", \"فليصبر\"], [\"بماذا يُغاثون إن استغاثوا في النار؟ (آية 29)\", \"بماء كالمهل يشوي الوجوه\", \"بماء بارد\", \"بعسل\"], [\"ماذا يلبس أهل الجنة؟ (آية 31)\", \"ثياباً خضراً من سندس وإستبرق\", \"ثياباً بيضاء من قطن\", \"دروعاً من حديد\"], [\"من أي معدن أساور أهل الجنة؟ (آية 31)\", \"من ذهب\", \"من حديد\", \"من نحاس\"], [\"ما اسم جنات المؤمنين في الآية 31؟ (آية 31)\", \"جنات عدن\", \"جنات الخلد فقط\", \"جنات النعيم فقط\"]]}, {\"n\": \"صاحب الجنتين\", \"e\": \"🍇\", \"q\": [[\"ماذا جعل الله لأحد الرجلين؟ (آية 32)\", \"جنتين من أعناب حفّتا بنخل\", \"قصراً من ذهب\", \"سفينة\"], [\"ماذا فجّر الله خلال الجنتين؟ (آية 33)\", \"نهراً\", \"عيناً صغيرة\", \"بئراً\"], [\"ماذا قال الرجل لصاحبه؟ (آية 34)\", \"أنا أكثر منك مالاً وأعزّ نفراً\", \"أنا أقلّ منك مالاً\", \"أنا أفقر منك\"], [\"ماذا ظنّ صاحب الجنة عن جنته؟ (آية 35)\", \"ما أظن أن تبيد هذه أبداً\", \"ستزول سريعاً\", \"هي لغيري\"], [\"ماذا قال له صاحبه المؤمن؟ (آية 37)\", \"أكفرتَ بالذي خلقك من تراب\", \"أحسنتَ يا صاحبي\", \"اذهب بمالك\"], [\"ماذا ينبغي أن يقول من دخل جنته؟ (آية 39)\", \"ما شاء الله لا قوة إلا بالله\", \"الحمد لله فقط\", \"سبحان الله فقط\"], [\"ماذا أصاب ثمر الجنة؟ (آية 42)\", \"أُحيط به فأصبح يقلّب كفيه\", \"ازداد وفرة\", \"بقي كما هو\"], [\"ماذا تمنّى صاحب الجنة بعد هلاكها؟ (آية 42)\", \"يا ليتني لم أشرك بربي أحداً\", \"يا ليتني ملكت أكثر\", \"يا ليتني سافرت\"], [\"بماذا شبّه الله الحياة الدنيا؟ (آية 45)\", \"بماء أنزله من السماء فأصبح النبات هشيماً تذروه الرياح\", \"بجبل ثابت\", \"بنهر دائم الجريان\"], [\"ما زينة الحياة الدنيا؟ (آية 46)\", \"المال والبنون\", \"الذهب والفضة فقط\", \"الملك والجاه فقط\"], [\"ماذا قال الله عن الباقيات الصالحات؟ (آية 46)\", \"خير عند ربك ثواباً وخير أملاً\", \"زائلة كالمال\", \"أقل من المال\"]]}, {\"n\": \"إبليس وبيان الحق\", \"e\": \"📖\", \"q\": [[\"من الذي أبى السجود لآدم؟ (آية 50)\", \"إبليس\", \"جبريل\", \"هاروت\"], [\"ممن كان إبليس؟ (آية 50)\", \"من الجن\", \"من الملائكة\", \"من البشر\"], [\"ماذا قال الله عن إبليس وذريته؟ (آية 50)\", \"وهم لكم عدوّ\", \"وهم لكم أولياء\", \"وهم لكم أصدقاء\"], [\"ماذا قال الله: «وكان الإنسان أكثر شيء ...»؟ (آية 54)\", \"جدلاً\", \"مالاً\", \"نسياناً\"], [\"«وربك الغفور ذو ...»؟ (آية 58)\", \"الرحمة\", \"العقاب\", \"الجلال\"], [\"ماذا ظنّ المجرمون حين رأوا النار؟ (آية 53)\", \"أنهم مواقعوها\", \"أنهم ناجون منها\", \"أنها بعيدة\"], [\"«وما كنتُ متخذ المضلين ...»؟ (آية 51)\", \"عضداً\", \"وليّاً\", \"صاحباً\"]]}, {\"n\": \"موسى والخضر\", \"e\": \"🌊\", \"q\": [[\"من الذي كان مع موسى في رحلته؟ (آية 60)\", \"فتاه\", \"هارون\", \"أخته\"], [\"إلى أين قال موسى إنه لن يبرح حتى يبلغه؟ (آية 60)\", \"مجمع البحرين\", \"الطور\", \"بيت المقدس\"], [\"ماذا نسيا عند الصخرة؟ (آية 61)\", \"حوتهما\", \"طعامهما\", \"عصاهما\"], [\"من الذي أنسى فتى موسى ذكر الحوت؟ (آية 63)\", \"الشيطان\", \"التعب\", \"النوم\"], [\"من الذي وجداه عند مجمع البحرين؟ (آية 65)\", \"عبداً من عباد الله آتاه الله رحمة وعلماً\", \"ملكاً\", \"راعياً\"], [\"ماذا طلب موسى من العبد الصالح؟ (آية 66)\", \"أن يعلّمه مما عُلّم رشداً\", \"أن يعطيه مالاً\", \"أن يحميه\"], [\"ماذا قال العبد الصالح لموسى؟ (آية 67)\", \"إنك لن تستطيع معي صبراً\", \"سأعلمك كل شيء\", \"اذهب معي ولا تسأل\"], [\"ماذا فعل العبد الصالح بالسفينة؟ (آية 71)\", \"خرقها\", \"أحرقها\", \"باعها\"], [\"ماذا فعل بالغلام؟ (آية 74)\", \"قتله\", \"علّمه\", \"اشتراه\"], [\"ماذا فعل بالجدار الذي يريد أن ينقض؟ (آية 77)\", \"أقامه\", \"هدمه\", \"طلاه\"], [\"لماذا خرق السفينة؟ (آية 79)\", \"لأنها لمساكين وكان وراءهم ملك يأخذ كل سفينة غصباً\", \"ليغرق أهلها\", \"ليأخذ ما فيها\"], [\"لماذا قتل الغلام؟ (آية 80)\", \"خشي أن يرهق أبويه المؤمنين طغياناً وكفراً\", \"لأنه سرق\", \"لأنه كذب\"], [\"ماذا كان تحت الجدار؟ (آية 82)\", \"كنز لغلامين يتيمين\", \"ماء\", \"ذهب لملك\"], [\"ماذا قال العبد الصالح: «هذا فراق ...»؟ (آية 78)\", \"بيني وبينك\", \"بيننا وبين الناس\", \"للأبد\"]]}, {\"n\": \"ذو القرنين\", \"e\": \"🛡️\", \"q\": [[\"عن من سأل الناس النبي ﷺ؟ (آية 83)\", \"ذي القرنين\", \"موسى\", \"يوسف\"], [\"ماذا آتى الله ذا القرنين؟ (آية 84)\", \"من كل شيء سبباً\", \"كنوز الأرض\", \"جنوداً من الملائكة\"], [\"أين وجد ذو القرنين الشمس تغرب؟ (آية 86)\", \"في عين حمئة\", \"في جبل\", \"في صحراء\"], [\"ماذا قال ذو القرنين للظالم؟ (آية 87)\", \"سوف نعذبه ثم يُردّ إلى ربه\", \"سوف نعفو عنه\", \"سوف نطرده فقط\"], [\"ماذا وجد عند مطلع الشمس؟ (آية 90)\", \"قوماً لم يجعل الله لهم من دونها ستراً\", \"جبلاً عالياً\", \"قصراً\"], [\"من الذين شكا منهم القوم الذين وجدهم بين السدّين؟ (آية 94)\", \"يأجوج ومأجوج\", \"عاد وثمود\", \"الجن\"], [\"ماذا طلبوا من ذي القرنين؟ (آية 94)\", \"أن يجعل بينهم وبين يأجوج ومأجوج سداً\", \"أن يقاتلهم\", \"أن يكون ملكاً عليهم\"], [\"ماذا قال لهم: «ما مكّني فيه ربي ...»؟ (آية 95)\", \"خير فأعينوني بقوة\", \"كافٍ فلا تعينوني\", \"أقل مما أريد\"], [\"ماذا طلب ليبني الردم؟ (آية 96)\", \"زُبَر الحديد\", \"الخشب\", \"الحجارة فقط\"], [\"ماذا أفرغ على الحديد المنفوخ؟ (آية 96)\", \"قِطراً (نحاساً مذاباً)\", \"ماءً\", \"رملاً\"], [\"هل استطاع يأجوج ومأجوج تسلّق السد أو نقبه؟ (آية 97)\", \"لا، ما استطاعوا ظهوره ولا نقبه\", \"نعم، تسلقوه\", \"نعم، نقبوه\"], [\"ماذا قال ذو القرنين: «فإذا جاء وعد ربي جعله ...»؟ (آية 98)\", \"دكّاء\", \"حديداً\", \"جبلاً\"]]}, {\"n\": \"خاتمة السورة\", \"e\": \"🏁\", \"q\": [[\"ما اسم جنات الذين آمنوا في الآية 107؟ (آية 107)\", \"جنات الفردوس\", \"جنات عدن فقط\", \"جنات الخلد فقط\"], [\"«لا يبغون عنها ...»؟ (آية 108)\", \"حِوَلاً\", \"بدلاً\", \"عودة\"], [\"ماذا قال الله: «لو كان البحر مداداً لكلمات ربي لنفد ...»؟ (آية 109)\", \"البحر قبل أن تنفد كلمات ربي\", \"الورق\", \"القلم\"], [\"ماذا قال النبي ﷺ: «إنما أنا بشر مثلكم يوحى إليّ أنما إلهكم ...»؟ (آية 110)\", \"إله واحد\", \"ملك عظيم\", \"نبي مرسل\"], [\"ماذا ينبغي لمن يرجو لقاء ربه؟ (آية 110)\", \"أن يعمل عملاً صالحاً ولا يشرك بعبادة ربه أحداً\", \"أن يسافر كثيراً\", \"أن يجمع المال\"], [\"ماذا يُنفخ فيه يوم القيامة؟ (آية 99)\", \"الصُّور\", \"الجرس\", \"الطبل\"], [\"من الأخسرون أعمالاً؟ (آية 104)\", \"الذين ضلّ سعيهم في الحياة الدنيا وهم يحسبون أنهم يحسنون صنعاً\", \"الذين يتركون الصلاة فقط\", \"الفقراء\"], [\"ماذا أعدّ الله جهنم للكافرين؟ (آية 102)\", \"نُزُلاً\", \"قصراً\", \"نهراً\"], [\"ماذا لا يُقام للكافرين يوم القيامة؟ (آية 105)\", \"وزناً\", \"مكاناً\", \"شفيعاً\"], [\"كيف كانت أعين الكافرين عن ذكر الله؟ (آية 101)\", \"في غطاء\", \"مفتوحة\", \"مغمضة\"]]}];\nconst GOOD=[\"ما شاء الله، أحسنت! 🌟\",\"بارك الله فيك! 👏\",\"ممتاز! 🎉\",\"أنت بطل! 💪\",\"رائع جداً! 🚀\",\"ما شاء الله تبارك الله! ✨\"];\nconst BAD=[\"لا بأس، أنت تتعلم! 🌱\",\"قريب جداً، ركّز في المرة القادمة 💛\",\"تعلّم الجواب وسنكمل 📖\"];\nconst COLORS=[\"#e8590c\",\"#2f9e44\",\"#1c7ed6\",\"#ae3ec9\",\"#d6336c\",\"#0c8599\",\"#f08c00\",\"#5f3dc4\"];\nconst $=id=>document.getElementById(id), rnd=a=>a[Math.floor(Math.random()*a.length)];\nfunction shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}\nlet best=Array(P.length+1).fill(0);\ntry{const s=JSON.parse(localStorage.getItem('kahf_best')||'[]');if(Array.isArray(s))best=best.map((x,i)=>+s[i]||0);}catch(e){}\nfunction save(){try{localStorage.setItem('kahf_best',JSON.stringify(best));}catch(e){}}\nfunction confetti(n){for(let i=0;i<n;i++){const c=document.createElement('div');c.className='cf';c.style.left=Math.random()*100+'vw';c.style.background=rnd(COLORS);c.style.animationDuration=(1.8+Math.random()*1.8)+'s';c.style.animationDelay=Math.random()*.4+'s';c.style.borderRadius=Math.random()>.5?'50%':'2px';document.body.appendChild(c);setTimeout(()=>c.remove(),4200);}}\nfunction say(t,color){const m=$('msg');if(!m)return;m.textContent=t;m.style.color=color;m.classList.remove('show');void m.offsetWidth;m.classList.add('show');}\nfunction stars(n){return '⭐'.repeat(n)+'☆'.repeat(3-n);}\nfunction nm(p){return p.n;}\n\nfunction home(){\n let h='<button class=\"rand\" onclick=\"quiz(-1)\">🎲 تحدّي عشوائي (30 سؤالاً) '+(best[P.length]?stars(best[P.length]):'')+'<\/button><div class=\"grid\">';\n P.forEach((p,i)=>{h+='<button class=\"pr\" style=\"animation-delay:'+(i*0.03)+'s\" onclick=\"quiz('+i+')\"><span class=\"em\">'+p.e+'<\/span><b>'+p.n+'<\/b><small>'+(best[i]?stars(best[i]):'')+'<\/small><\/button>';});\n h+='<\/div><p style=\"text-align:center;color:var(--sub);margin-top:16px\">اختر قسماً من سورة الكهف وأجب عن أسئلته، أو جرّب التحدي العشوائي من السورة كلها.<\/p>';\n $('app').innerHTML=h;\n}\nlet Q=null;\nlet lastRand=new Set();\nfunction quiz(pi){\n let list;\n if(pi<0){\n  const all=[];P.forEach(p=>p.q.forEach(x=>all.push({p:p,x:x})));\n  const fresh=all.filter(o=>!lastRand.has(o.x[0]));\n  const pool=fresh.length>=30?fresh:all;\n  list=shuffle(pool).slice(0,30);\n  lastRand=new Set(list.map(o=>o.x[0]));\n }else{\n  list=shuffle(P[pi].q).map(x=>({p:P[pi],x:x}));\n }\n Q={pi:pi,list:list,n:list.length,i:0,pts:0,streak:0,right:0,lock:false};\n ask();\n}\nfunction ask(){\n const it=Q.list[Q.i],x=it.x;\n const opts=shuffle([x[1],x[2],x[3]]);\n Q.ans=x[1];Q.lock=false;\n let h='<div class=\"top\"><span class=\"pill\">📖 '+(Q.i+1)+' / '+Q.n+'<\/span><span class=\"pill\">🔥 '+Q.streak+'<\/span><span class=\"pill\">⭐ '+Q.pts+'<\/span><\/div><div class=\"bar\"><i style=\"width:'+(Q.i/Q.n*100)+'%\"><\/i><\/div><div class=\"big\"><div class=\"who\">'+it.p.e+' '+nm(it.p)+'<\/div><div class=\"qq\">'+x[0]+'<\/div><\/div><div class=\"opts\">';\n opts.forEach((o,n)=>{h+='<button class=\"opt\" style=\"animation-delay:'+n*0.07+'s\" data-a=\"'+o.replace(/\"/g,'&quot;')+'\" onclick=\"pick(this)\">'+o+'<\/button>';});\n h+='<\/div><div id=\"msg\"><\/div>';\n $('app').innerHTML=h;\n}\nfunction pick(b){\n if(Q.lock)return;Q.lock=true;\n const ok=b.dataset.a===Q.ans;\n if(ok){b.classList.add('good');Q.streak++;Q.right++;Q.pts+=10+Math.min(Q.streak-1,5)*2;confetti(25);say(Q.streak>=3?'سلسلة رائعة: '+Q.streak+' 🔥':rnd(GOOD),'var(--ok)');}\n else{b.classList.add('bad');Q.streak=0;document.querySelectorAll('.opt').forEach(x=>{if(x.dataset.a===Q.ans)x.classList.add('good');});say(rnd(BAD),'var(--err)');}\n setTimeout(()=>{Q.i++;if(Q.i<Q.n)ask();else finish();},1500);\n}\nfunction finish(){\n const pc=Q.right/Q.n,s=pc>=0.9?3:pc>=0.7?2:pc>=0.5?1:0;\n const k=Q.pi<0?P.length:Q.pi;\n if(s>best[k]){best[k]=s;save();}\n if(s>=2)confetti(140);\n const msg=s===3?'ما شاء الله! إجابات ممتازة':s===2?'أحسنت! أداء رائع':s===1?'بداية جميلة، حاول مرة أخرى':'لا بأس، راجع وحاول من جديد';\n const nxt=(Q.pi>=0&&Q.pi<P.length-1)?'<button onclick=\"quiz('+(Q.pi+1)+')\">القسم التالي ⬅<\/button>':'';\n $('app').innerHTML='<div class=\"res\"><div class=\"e\">'+(s>=2?'🏆':'🌱')+'<\/div><h2>'+Q.right+' من '+Q.n+'<\/h2><div class=\"s\">'+stars(s)+'<\/div><p style=\"font-size:19px;font-weight:600\">'+msg+'<\/p><p>نقاطك: '+Q.pts+'<\/p><\/div><div class=\"row\"><button class=\"pri\" onclick=\"quiz('+Q.pi+')\">🔄 مرة أخرى<\/button><button class=\"sec\" onclick=\"home()\">🏠 الرئيسية<\/button><\/div>'+(nxt?'<div class=\"row\" style=\"margin-top:10px\">'+nxt+'<\/div>':'');\n}\nhome();\n<\/script>\n<\/body>\n<\/html>\n"};
function go(k){document.getElementById('menu').style.display='none';document.getElementById('game').style.display='flex';document.getElementById('f').srcdoc=G[k];}
