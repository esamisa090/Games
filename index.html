onst BAD=[\"لا بأس، أنت تتعلم! 🌱\",\"قريب جداً، ركّز في المرة القادمة 💛\",\"تذكّر الجواب وسنكمل 📖\"];\nconst COLORS=[\"#e8590c\",\"#2f9e44\",\"#1c7ed6\",\"#ae3ec9\",\"#d6336c\",\"#0c8599\",\"#f08c00\",\"#5f3dc4\"];\nconst $=id=>document.getElementById(id), rnd=a=>a[Math.floor(Math.random()*a.length)];\nfunction shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}\nlet best=Array(LV).fill(0);\ntry{const s=JSON.parse(localStorage.getItem('asma_best')||'[]');if(Array.isArray(s))best=best.map((x,i)=>+s[i]||0);}catch(e){}\nfunction save(){try{localStorage.setItem('asma_best',JSON.stringify(best));}catch(e){}}\nfunction confetti(n){for(let i=0;i<n;i++){const c=document.createElement('div');c.className='cf';c.style.left=Math.random()*100+'vw';c.style.background=rnd(COLORS);c.style.animationDuration=(1.8+Math.random()*1.8)+'s';c.style.animationDelay=Math.random()*.4+'s';c.style.borderRadius=Math.random()>.5?'50%':'2px';document.body.appendChild(c);setTimeout(()=>c.remove(),4200);}}\nfunction say(t,color){const m=$('msg');if(!m)return;m.textContent=t;m.style.color=color;m.classList.remove('show');void m.offsetWidth;m.classList.add('show');}\nfunction items(l){return N.slice(l*PER,l*PER+PER);}\n\nfunction home(){\n let h='<div class=\"grid\">';\n for(let l=0;l<LV;l++){\n  const it=items(l);\n  h+='<div class=\"lvl\" style=\"animation-delay:'+l*0.08+'s\"><b>المستوى '+(l+1)+'<\/b><small>'+it[0][0]+' ... '+it[it.length-1][0]+'<\/small><div class=\"st\">'+('⭐'.repeat(best[l])+'☆'.repeat(3-best[l]))+'<\/div><div class=\"row\" style=\"margin-top:8px\"><button class=\"sec\" onclick=\"learn('+l+')\">تعلّم<\/button><button class=\"pri\" onclick=\"quiz('+l+')\">اختبر<\/button><\/div><\/div>';\n }\n h+='<\/div><p style=\"text-align:center;color:var(--sub);margin-top:16px\">أسماء الله الحسنى التسعة والتسعون في '+LV+' مستويات. تعلّم أولاً ثم اختبر نفسك.<\/p>';\n $('app').innerHTML=h;\n}\n\nfunction learn(l,i){\n i ue;\n const ok=b.dataset.n===Q.cur.ans;\n if(ok){b.classList.add('good');Q.streak++;Q.pts+=10+Math.min(Q.streak-1,5)*2;confetti(25);say(Q.streak>=3?'سلسلة رائعة: '+Q.streak+' 🔥':rnd(GOOD),'var(--ok)');}\n else{b.classList.add('bad');Q.streak=0;document.querySelectorAll('.opt').forEach(x=>{if(x.dataset.n===Q.cur.ans)x.classList.add('good');});say(rnd(BAD),'var(--err)');}\n if(ok)Q.right=(Q.right||0)+1;\n setTimeout(()=>{Q.i++;if(Q.i<Q.n)ask();else finish();},1400);\n}\nfunction finish(){\n const r=Q.right||0,pc=r/Q.n,s=pc>=0.9?3:pc>=0.7?2:pc>=0.5?1:0;\n if(s>best[Q.l]){best[Q.l]=s;save();}\n if(s>=2)confetti(140);\n const msg=s===3?'ما شاء الله! حفظتَ المستوى كاملاً':s===2?'أحسنت! تقريباً أتقنتَ المستوى':s===1?'بداية جميلة، راجع وحاول مرة أخرى':'لا بأس، تعلّم مرة أخرى وستنجح';\n $('app').innerHTML='<div class=\"res\"><div class=\"e\">'+(s>=2?'🏆':'🌱')+'<\/div><h2>'+r+' من '+Q.n+'<\/h2><div class=\"s\">'+('⭐'.repeat(s)+'☆'.repeat(3-s))+'<\/div><p style=\"font-size:19px;font-weight:600\">'+msg+'<\/p><p>نقاطك: '+Q.pts+'<\/p><\/div><div class=\"row\"><button class=\"pri\" onclick=\"quiz('+Q.l+')\">🔄 اختبار جديد<\/button><button class=\"sec\" onclick=\"learn('+Q.l+')\">📖 تعلّم<\/button><\/div><div class=\"row\" style=\"margin-top:10px\">'+(Q.l<LV-1?'<button onclick=\"learn('+(Q.l+1)+')\">المستوى التالي ⬅<\/button>':'')+'<button onclick=\"home()\">🏠 الرئيسية<\/button><\/div>';\n}\nhome();\n<\/script>\n<\/body>\n<\/html>\n",p:"<!DOCTYPE html>\n<html lang=\"ar\" dir=\"rtl\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>لعبة الأنبياء<\/title>\n<style>\n:root{--bg:#fff7ec;--card:#ffe9cc;--text:#2c2a26;--sub:#7a5a30;--border:#f0b36a;--ok:#2e9e5b;--err:#e24b4a;--accent:#d9480f;--white:#fff;\nbox-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}\n@media (prefers-color-scheme:dark){:root:not([data-theme=\"light\"]){--bg:#251a12;--card:#3a2a1c;--text:#fbeede;--sub:#e0c19a;--border:#8a5a2c;--ok:#5fd68c;--err:#ff8a89;--accent:#ff9b5c;--white:#251a12}}\n:root[data-theme=\"dark\"]{--bg:#251a12;--card:#3a2a1c;--text:#fbeede;--sub:#e0c19a;--border:#8a5a2c;--ok:#5fd68c;--err:#ff8a89;--accent:#ff9b5c;--white:#251a12}\n*{box-sizing:border-box}\nbody{margin:0;background:var(--bg);color:var(--text);font-family:\"Segoe UI\",Tahoma,Arial,sans-serif;overflow-x:hidden}\nmain{max-width:560px;margin:0 auto;padding:16px}\nh1{font-size:24px;font-weight:600;margin:0 0 12px;text-align:center;color:var(--accent)}\nbutton{font:inherit;color:var(--text);background:transparent;border:2px solid var(--border);border-radius:14px;padding:10px 14px;cursor:pointer;transition:transform .12s}\nbutton:active{transform:scale(.95)}\n.rand{display:block;width:100%;font-size:20px;font-weight:600;background:var(--accent);border-color:var(--accent);color:var(--white);padding:16px;margin-bottom:14px;animation:pop .4s}\n.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}\n.pr{background:var(--card);padding:10px 4px;text-align:center;animation:pop .4s backwards}\n.pr .em{font-size:28px;display:block}\n.pr b{display:block;font-size:16px}\n.pr small{display:block;font-size:12px;min-height:16px}\n.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px;font-size:15px}\n.pill{background:var(--card);border-radius:999px;padding:5px 12px;font-weight:600}\n.bar{height:12px;background:var(--card);border-radius:999px;overflow:hidden;margin-bottom:14px}\n.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff9f1c,#ffd23f,#2ec4b6);border-radius:999px;transition:width .5s}\n.big{background:var(--card);border:2px solid var(--border);border-radius:22px;padding:18px 14px;text-align:center;margin-bottom:14px;min-height:130px;display:flex;flex-direction:column;justify-content:center;gap:8px;animation:pop .4s}\n.big .who{font-size:15px;color:var(--accent);font-weight:600}\n.big .qq{font-size:22px;line-height:1.7;font-weight:600}\n.opts{display:grid;gap:10px;margin-bottom:12px}\n.opt{font-size:19px;line-height:1.6;padding:10px 14px;background:var(--card);animation:pop .35s backwards}\n.opt.good{background:var(--ok);border-color:var(--ok);color:#fff;animation:bounce .6s}\n.opt.bad{background:var(--err);border-color:var(--err);color:#fff;animation:shake .4s}\n#msg{min-height:34px;font-size:19px;font-weight:600;text-align:center;margin-bottom:10px}\n#msg.show{animation:bounce .6s}\n.row{display:flex;gap:8px}.row button{flex:1;font-weight:600}\n.pri{background:var(--ok);border-color:var(--ok);color:#fff}\n.sec{background:var(--accent);border-color:var(--accent);color:var(--white)}\n.res{text-align:center;animation:pop .5s}\n.res .e{font-size:64px;animation:bounce 1s infinite}\n.res .s{font-size:34px;letter-spacing:6px;margin:6px 0}\n.cf{position:fixed;top:-20px;width:10px;height:14px;z-index:9;pointer-events:none;animation:fall linear forwards}\n@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.07)}100%{transform:scale(1);opacity:1}}\n@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}\n@keyframes bounce{0%,100%{transform:translateY(0)}30%{transform:translateY(-12px)}60%{transform:translateY(0)}80%{transform:translateY(-5px)}}\n@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:.9}}\n@media (prefers-reduced-motion:reduce){*{animation:none!important}}\n<\/style>\n<\/head>\n<body>\n<main>\n<section>\n<h1>🕌 أسئلة عن الأنبياء ⭐<\/h1>\n<div id=\"app\"><\/div>\n<\/section>\n<\/main>\n<script>\nconst P=[{\"n\": \"آدم\", \"e\": \"🌱\", \"q\": [[\"من أي مادة خلق الله آدم؟\", \"من طين\", \"من نور\", \"من نار\"], [\"من الذي رفض السجود لآدم؟\", \"إبليس\", \"جبريل\", \"ميكائيل\"], [\"ما اسم زوجة آدم؟\", \"حواء\", \"مريم\", \"سارة\"], [\"أين أسكن الله آدم وزوجه في البداية؟\", \"في الجنة\", \"في الأرض\", \"في جبل\"], [\"ماذا علّم الله آدم؟\", \"الأسماء كل e=\"text-align:center;color:var(--sub);margin-top:16px\">اختر نبياً وأجب عن أسئلته، أو جرّب التحدي العشوائي من كل الأنبياء.<\/p>';\n $('app').innerHTML=h;\n}\nlet Q=null;\nlet lastRand=new Set();\nfunction quiz(pi){\n let list;\n if(pi<0){\n  const all=[];P.forEach(p=>p.q.forEach(x=>all.push({p:p,x:x})));\n  const fresh=all.filter(o=>!lastRand.has(o.x[0]));\n  const pool=fresh.length>=30?fresh:all;\n  list=shuffle(pool).slice(0,30);\n  lastRand=new Set(list.map(o=>o.x[0]));\n }else{\n  list=shuffle(P[pi].q).map(x=>({p:P[pi],x:x}));\n }\n Q={pi:pi,list:list,n:list.length,i:0,pts:0,streak:0,right:0,lock:false};\n ask();\n}\nfunction ask(){\n const it=Q.list[Q.i],x=it.x;\n const opts=shuffle([x[1],x[2],x[3]]);\n Q.ans=x[1];Q.lock=false;\n let h='<div class=\"top\"><span class=\"pill\">📖 '+(Q.i+1)+' / '+Q.n+'<\/span><span class=\"pill\">🔥 '+Q.streak+'<\/span><span class=\"pill\">⭐ '+Q.pts+'<\/span><\/div><div class=\"bar\"><i style=\"width:'+(Q.i/Q.n*100)+'%\"><\/i><\/div><div class=\"big\"><div class=\"who\">'+it.p.e+' '+nm(it.p)+'<\/div><div class=\"qq\">'+x[0]+'<\/div><\/div><div class=\"opts\">';\n opts.forEach((o,n)=>{h+='<button class=\"opt\" style=\"animation-delay:'+n*0.07+'s\" data-a=\"'+o.replace(/\"/g,'&quot;')+'\" onclick=\"pick(this)\">'+o+'<\/button>';});\n h+='<\/div><div id=\"msg\"><\/div>';\n $('app').innerHTML=h;\n}\nfunction pick(b){\n if(Q.lock)return;Q.lock=true;\n const ok=b.dataset.a===Q.ans;\n if(ok){b.classList.add('good');Q.streak++;Q.right++;Q.pts+=10+Math.min(Q.streak-1,5)*2;confetti(25);say(Q.streak>=3?'سلسلة رائعة: '+Q.streak+' 🔥':rnd(GOOD),'var(--ok)');}\n else{b.classList.add('bad');Q.streak=0;document.querySelectorAll('.opt').forEach(x=>{if(x.dataset.a===Q.ans)x.classList.add('good');});say(rnd(BAD),'var(--err)');}\n setTimeout(()=>{Q.i++;if(Q.i<Q.n)ask();else finish();},1500);\n}\nfunction finish(){\n const pc=Q.right/Q.n,s=pc>=0.9?3:pc>=0.7?2:pc>=0.5?1:0;\n const k=Q.pi<0?P.length:Q.pi;\n if(s>best[k]){best[k]=s;save();}\n if(s>=2)confetti(140);\n const msg=s===3?'ما شاء الله! إجابات ممتازة':s===2?'أحسنت! أداء رائع':s===1?'بداية جميلة، حاول مرة أخرى':'لا بأس، راجع وحاول من جديد';\n const nxt=(Q.pi>=0&&Q.pi<P.length-1)?'<button onclick=\"quiz('+(Q.pi+1)+')\">النبي التالي ⬅<\/button>':'';\n $('app').innerHTML='<div class=\"res\"><div class=\"e\">'+(s>=2?'🏆':'🌱')+'<\/div><h2>'+Q.right+' من '+Q.n+'<\/h2><div class=\"s\">'+stars(s)+'<\/div><p style=\"font-size:19px;font-weight:600\">'+msg+'<\/p><p>نقاطك: '+Q.pts+'<\/p><\/div><div class=\"row\"><button class=\"pri\" onclick=\"quiz('+Q.pi+')\">🔄 مرة أخرى<\/button><button class=\"sec\" onclick=\"home()\">🏠 الرئيسية<\/button><\/div>'+(nxt?'<div class=\"row\" style=\"margin-top:10px\">'+nxt+'<\/div>':'');\n}\nhome();\n<\/script>\n<\/body>\n<\/html>\n",s:"<!DOCTYPE html>\n<html lang=\"ar\" dir=\"rtl\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>لعبة السيرة النبوية<\/title>\n<style>\n:root{--bg:#fff7ec;--card:#ffe9cc;--text:#2c2a26;--sub:#7a5a30;--border:#f0b36a;--ok:#2e9e5b;--err:#e24b4a;--accent:#1971c2;--white:#fff;\nbox-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}\n@media (prefers-color-scheme:dark){:root:not([data-theme=\"light\"]){--bg:#251a12;--card:#3a2a1c;--text:#fbeede;--sub:#e0c19a;--border:#8a5a2c;--ok:#5fd68c;--err:#ff8a89;--accent:#74c0fc;--white:#251a12}}\n:root[data-theme=\"dark\"]{--bg:#251a12;--card:#3a2a1c;--text:#fbeede;--sub:#e0c19a;--border:#8a5a2c;--ok:#5fd68c;--err:#ff8a89;--accent:#74c0fc;--white:#251a12}\n*{box-sizing:border-box}\nbody{margin:0;background:var(--bg);color:var(--text);font-family:\"Segoe UI\",Tahoma,Arial,sans-serif;overflow-x:hidden}\nmain{max-width:560px;margin:0 auto;padding:16px}\nh1{font-size:24px;font-weight:600;margin:0 0 12px;text-align:center;color:var(--accent)}\nbutton{font:inherit;color:var(--text);background:transparent;border:2px solid var(--border);border-radius:14px;padding:10px 14px;cursor:pointer;transition:transform .12s}\nbutton:active{transform:scale(.95)}\n.rand{display:block;width:100%;font-size:20px;font-weight:600;background:var(--accent);border-color:var(--accent);color:var(--white);padding:16px;margin-bottom:14px;animation:pop .4s}\n.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}\n.pr{background:var(--card);padding:10px 4px;text-align:center;animation:pop .4s backwards}\n.pr .em{font-size:28px;display:block}\n.pr b{display:block;font-size:16px}\n.pr small{display:block;font-size:12px;min-height:16px}\n.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px;font-size:15px}\n.pill{background:var(--card);border-radius:999px;padding:5px 12px;font-weight:600}\n.bar{height:12px;background:var(--card);border-radius:999px;overflow:hidden;margin-bottom:14px}\n.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff9f1c,#ffd23f,#2ec4b6);border-radius:999px;transition:width .5s}\n.big{background:var(--card);border:2px solid var(--border);border-radius:22px;padding:18px 14px;text-align:center;margin-bottom:14px;min-height:130px;display:flex;flex-direction:column;justify-content:center;gap:8px;animation:pop .4s}\n.big .who{font-size:15px;color:var(--accent);font-weight:600}\n.big .qq{font-size:22px;line-height:1.7;font-weight:600}\n.opts{display:grid;gap:10px;margin-bottom:12px}\n.opt{font-size:19px;line-height:1.6;padding:10px 14px;background:var(--card);animation:pop .35s backwards}\n.opt.good{background:var(--ok);border-color:var(--ok);color:#fff;animation:bounce .6s}\n.opt.bad{background:var(--err);border-color:var(--err);color:#fff;animation:shake .4s}\n#msg{min-height:34px;font-size:19px;font-weight:600;text-align:center;margin-bottom:10px}\n#msg.show{animation:bounce .6s}\n.row{display:flex;gap:8px}.row button{flex:1;font-weight:600}\n.pri{background:var(--ok);border-color:var(--ok);color:#fff}\n.sec{background:var(--acce  GOOD=[\"ما شاء الله، أحسنت! 🌟\",\"بارك الله فيك! 👏\",\"ممتاز! 🎉\",\"أنت بطل! 💪\",\"رائع جداً! 🚀\",\"ما شاء الله تبارك الله! ✨\"];\nconst BAD=[\"لا بأس، أنت تتعلم! 🌱\",\"قريب جداً، ركّز في المرة القادمة 💛\",\"تعلّم الجواب وسنكمل 📖\"];\nconst COLORS=[\"#e8590c\",\"#2f9e44\",\"#1c7ed6\",\"#ae3ec9\",\"#d6336c\",\"#0c8599\",\"#f08c00\",\"#5f3dc4\"];\nconst $=id=>document.getElementById(id), rnd=a=>a[Math.floor(Math.random()*a.length)];\nfunction shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}\nlet best=Array(P.length+1).fill(0);\ntry{const s=JSON.parse(localStorage.getItem('sira_best')||'[]');if(Array.isArray(s))best=best.map((x,i)=>+s[i]||0);}catch(e){}\nfunction save(){try{localStorage.setItem('sira_best',JSON.stringify(best));}catch(e){}}\nfunction confetti(n){for(let i=0;i<n;i++){const c=document.createElement('div');c.className='cf';c.style.left=Math.random()*100+'vw';c.style.background=rnd(COLORS);c.style.animationDuration=(1.8+Math.random()*1.8)+'s';c.style.animationDelay=Math.random()*.4+'s';c.style.borderRadius=Math.random()>.5?'50%':'2px';document.body.appendChild(c);setTimeout(()=>c.remove(),4200);}}\nfunction say(t,color){const m=$('msg');if(!m)return;m.textContent=t;m.style.color=color;m.classList.remove('show');void m.offsetWidth;m.classList.add('show');}\nfunction stars(n){return '⭐'.repeat(n)+'☆'.repeat(3-n);}\nfunction nm(p){return p.n;}\n\nfunction home(){\n let h='<button class=\"rand\" onclick=\"quiz(-1)\">🎲 تحدّي عشوائي (30 سؤالاً) '+(best[P.length]?stars(best[P.length]):'')+'<\/button><div class=\"grid\">';\n P.forEach((p,i)=>{h+='<button class=\"pr\" style=\"animation-delay:'+(i*0.03)+'s\" onclick=\"quiz('+i+')\"><span class=\"em\">'+p.e+'<\/span><b>'+p.n+'<\/b><small>'+(best[i]?stars(best[i]):'')+'<\/small><\/button>';});\n h+='<\/div><p style=\"text-align:center;color:var(--sub);margin-top:16px\">اختر مرحلة من سيرة النبي ﷺ وأجب عن أسئلتها، أو جرّب التحدي العشوائي من كل السيرة.<\/p>';\n $('app').innerHTML=h;\n}\nlet Q=null;\nlet lastRand=new Set();\nfunction quiz(pi){\n let list;\n if(pi<0){\n  const all=[];P.forEach(p=>p.q.forEach(x=>all.push({p:p,x:x})));\n  const fresh=all.filter(o=>!lastRand.has(o.x[0]));\n  const pool=fresh.length>=30?fresh:all;\n  list=shuffle(pool).slice(0,30);\n  lastRand=new Set(list.map(o=>o.x[0]));\n }else{\n  list=shuffle(P[pi].q).map(x=>({p:P[pi],x:x}));\n }\n Q={pi:pi,list:list,n:list.length,i:0,pts:0,streak:0,right:0,lock:false};\n ask();\n}\nfunction ask(){\n const it=Q.list[Q.i],x=it.x;\n const opts=shuffle([x[1],x[2],x[3]]);\n Q.ans=x[1];Q.lock=false;\n let h='<div class=\"top\"><span class=\"pill\">📖 '+(Q.i+1)+' / '+Q.n+'<\/span><span class=\"pill\">🔥 '+Q.streak+'<\/span><span class=\"pill\">⭐ '+Q.pts+'<\/span><\/div><div class=\"bar\"><i style=\"width:'+(Q.i/Q.n*100)+'%\"><\/i><\/div><div class=\"big\"><div class=\"who\">'+it.p.e+' '+nm(it.p)+'<\/div><div class=\"qq\">'+x[0]+'<\/div><\/div><div class=\"opts\">';\n opts.forEach((o,n)=>{h+='<button class=\"opt\" style=\"animation-delay:'+n*0.07+'s\" data-a=\"'+o.replace(/\"/g,'&quot;')+'\" onclick=\"pick(this)\">'+o+'<\/button>';});\n h+='<\/div><div id=\"msg\"><\/div>';\n $('app').innerHTML=h;\n}\nfunction pick(b){\n if(Q.lock)return;Q.lock=true;\n const ok=b.dataset.a===Q.ans;\n if(ok){b.classList.add('good');Q.streak++;Q.right++;Q.pts+=10+Math.min(Q.streak-1,5)*2;confetti(25);say(Q.streak>=3?'سلسلة رائعة: '+Q.streak+' 🔥':rnd(GOOD),'var(--ok)');}\n else{b.classList.add('bad');Q.streak=0;document.querySelectorAll('.opt').forEach(x=>{if(x.dataset.a===Q.ans)x.classList.add('good');});say(rnd(BAD),'var(--err)');}\n setTimeout(()=>{Q.i++;if(Q.i<Q.n)ask();else finish();},1500);\n}\nfunction finish(){\n const pc=Q.right/Q.n,s=pc>=0.9?3:pc>=0.7?2:pc>=0.5?1:0;\n const k=Q.pi<0?P.length:Q.pi;\n if(s>best[k]){best[k]=s;save();}\n if(s>=2)confetti(140);\n const msg=s===3?'ما شاء الله! إجابات ممتازة':s===2?'أحسنت! أداء رائع':s===1?'بداية جميلة، حاول مرة أخرى':'لا بأس، راجع وحاول من جديد';\n const nxt=(Q.pi>=0&&Q.pi<P.length-1)?'<button onclick=\"quiz('+(Q.pi+1)+')\">المرحلة التالية ⬅<\/button>':'';\n $('app').innerHTML='<div class=\"res\"><div class=\"e\">'+(s>=2?'🏆':'🌱')+'<\/div><h2>'+Q.right+' من '+Q.n+'<\/h2><div class=\"s\">'+stars(s)+'<\/div><p style=\"font-size:19px;font-weight:600\">'+msg+'<\/p><p>نقاطك: '+Q.pts+'<\/p><\/div><div class=\"row\"><button class=\"pri\" onclick=\"quiz('+Q.pi+')\">🔄 مرة أخرى<\/button><button class=\"sec\" onclick=\"home()\">🏠 الرئيسية<\/button><\/div>'+(nxt?'<div class=\"row\" style=\"margin-top:10px\">'+nxt+'<\/div>':'');\n}\nhome();\n<\/script>\n<\/body>\n<\/html>\n"};
function go(k){document.getElementById('menu').style.display='none';document.getElementById('game').style.display='flex';document.getElementById('f').srcdoc=G[k];}
function back(){document.getElementById('game').style.display='none';document.getElementById('f').srcdoc='';document.getElementById('menu').style.display='block';}
