=document.createElement('div');c.className='cf';c.style.left=Math.random()*100+'vw';c.style.background=rnd(COLORS);c.style.animationDuration=(1.8+Math.random()*1.8)+'s';c.style.animationDelay=Math.random()*.4+'s';c.style.borderRadius=Math.random()>.5?'50%':'2px';document.body.appendChild(c);setTimeout(()=>c.remove(),4200);}}\nfunction say(t,color){const m=$('msg');m.textContent=t;m.style.color=color;m.classList.remove('show');void m.offsetWidth;m.classList.add('show');}\nfunction tabs(){const s=$('surahs');s.innerHTML='';Object.keys(DATA).forEach(k=>{const b=document.createElement('button');b.textContent='سورة '+k;if(k===cur)b.className='on';b.onclick=()=>{cur=k;idx=0;pts=0;streak=0;solved=0;load();tabs();};s.appendChild(b);});}\nfunction load(){words=DATA[cur][idx].split(' ');picked=[];done=false;order=shuffle(words.map((w,i)=>i));$('msg').textContent='';$('answer').className='box';$('next').style.display='';draw();}\nfunction draw(){\n const total=DATA[cur].length;\n $('prog').textContent='📖 '+(idx+1)+' / '+total;\n $('streak').textContent='🔥 '+streak;\n $('score').textContent='⭐ '+pts;\n $('fill').style.width=(solved/total*100)+'%';\n let st='';for(let i=0;i<solved;i++)st+='<span>⭐<\/span>';$('stars').innerHTML=st;\n const a=$('answer');a.innerHTML='';\n if(!picked.length){const h=document.createElement('span');h.className='hint';h.textContent='اضغط الكلمات بترتيب الآية';a.appendChild(h);}\n picked.forEach((i,k)=>a.appendChild(chip(words[i],i,()=>{if(done)return;picked=picked.filter(x=>x!==i);draw();},0)));\n const p=$('pool');p.innerHTML='';\n order.filter(i=>!picked.includes(i)).forEach((i,k)=>p.appendChild(chip(words[i],i,()=>{if(done)return;picked.push(i);draw();check();},k)));\n}\nfunction check(){\n if(picked.length<words.length)return;\n const ok=picked.every((w,k)=>words[w]===words[k]);\n const box=$('answer');\n if(ok){\n  done=true;streak++;solved++;pts+=10+Math.min(streak-1,5)*2;\n  box.className='box win';\n  const last=idx===DATA[cur].length-1;\n  co onst BAD=[\"لا بأس، أنت تتعلم! 🌱\",\"قريب جداً، ركّز في المرة القادمة 💛\",\"تذكّر الجواب وسنكمل 📖\"];\nconst COLORS=[\"#e8590c\",\"#2f9e44\",\"#1c7ed6\",\"#ae3ec9\",\"#d6336c\",\"#0c8599\",\"#f08c00\",\"#5f3dc4\"];\nconst $=id=>document.getElementById(id), rnd=a=>a[Math.floor(Math.random()*a.length)];\nfunction shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}\nlet best=Array(LV).fill(0);\ntry{const s=JSON.parse(localStorage.getItem('asma_best')||'[]');if(Array.isArray(s))best=best.map((x,i)=>+s[i]||0);}catch(e){}\nfunction save(){try{localStorage.setItem('asma_best',JSON.stringify(best));}catch(e){}}\nfunction confetti(n){for(let i=0;i<n;i++){const c=document.createElement('div');c.className='cf';c.style.left=Math.random()*100+'vw';c.style.background=rnd(COLORS);c.style.animationDuration=(1.8+Math.random()*1.8)+'s';c.style.animationDelay=Math.random()*.4+'s';c.style.borderRadius=Math.random()>.5?'50%':'2px';document.body.appendChild(c);setTimeout(()=>c.remove(),4200);}}\nfunction say(t,color){const m=$('msg');if(!m)return;m.textContent=t;m.style.color=color;m.classList.remove('show');void m.offsetWidth;m.classList.add('show');}\nfunction items(l){return N.slice(l*PER,l*PER+PER);}\n\nfunction home(){\n let h='<div class=\"grid\">';\n for(let l=0;l<LV;l++){\n  const it=items(l);\n  h+='<div class=\"lvl\" style=\"animation-delay:'+l*0.08+'s\"><b>المستوى '+(l+1)+'<\/b><small>'+it[0][0]+' ... '+it[it.length-1][0]+'<\/small><div class=\"st\">'+('⭐'.repeat(best[l])+'☆'.repeat(3-best[l]))+'<\/div><div class=\"row\" style=\"margin-top:8px\"><button class=\"sec\" onclick=\"learn('+l+')\">تعلّم<\/button><button class=\"pri\" onclick=\"quiz('+l+')\">اختبر<\/button><\/div><\/div>';\n }\n h+='<\/div><p style=\"text-align:center;color:var(--sub);margin-top:16px\">أسماء الله الحسنى التسعة والتسعون في '+LV+' مستويات. تعلّم أولاً ثم اختبر نفسك.<\/p>';\n $('app').innerHTML=h;\n}\n\nfunction learn(l,i){\n i=i||0;const it=items(l),d=it[i];\n $('app').innerHTML='<div class=\"top\"><span class=\"pill\">المستوى '+(l+1)+'<\/span><span class=\"pill\">'+(i+1)+' / '+it.length+'<\/span><\/div><div class=\"bar\"><i style=\"width:'+((i+1)/it.length*100)+'%\"><\/i><\/div><div class=\"big\"><div class=\"nm\">'+d[0]+'<\/div><div class=\"mn\">'+d[1]+'<\/div><\/div><div class=\"row\"><button '+(i?'':'style=\"visibility:hidden\"')+' onclick=\"learn('+l+','+(i-1)+')\">➡ السابق<\/button>'+(i<it.length-1?'<button class=\"pri\" onclick=\"learn('+l+','+(i+1)+')\">التالي ⬅<\/button>':'<button class=\"pri\" onclick=\"quiz('+l+')\">ابدأ الاختبار 🚀<\/button>')+'<\/div><div class=\"row\" style=\"margin-top:10px\"><button onclick=\"home()\">🏠 الرئيسية<\/button><\/div>';\n}\n\nlet Q=null;\nfunction quiz(l){\n const it=items(l);\n Q={l,n:it.length,qs:shuffle(it.map((x,k)=>k)).map((k,n)=>({k,rev:n%2===1})),i:0,pts:0,streak:0,lock:false};\n ask();\n}\nfunction ask(){\n const it=items(Q.l),q=Q.qs[Q.i],d=it[q.k];\n const gi=N.indexOf(d),grp=GRP.find(g=>g.includes(gi))||[gi];const pool=N.filter((x,k)=>!grp.includes(k));\n const others=shuffle(pool).slice(0,2);\n const opts=shuffle([d].concat(others));\n Q.cur={ans:d[0],opts};Q.lock=false;\n const prompt=q.rev?'<div class=\"q\">ما الاسم الذي معناه:<\/div><div class=\"mn\">'+d[1]+'<\/div>':'<div class=\"q\">ما معنى هذا الاسم؟<\/div><div class=\"nm\">'+d[0]+'<\/div>';\n let h='<div class=\"top\"><span class=\"pill\">📖 '+(Q.i+1)+' / '+Q.n+'<\/span><span class=\"pill\">🔥 '+Q.streak+'<\/span><span class=\"pill\">⭐ '+Q.pts+'<\/span><\/div><div class=\"bar\"><i style=\"width:'+(Q.i/Q.n*100)+'%\"><\/i><\/div><div class=\"big\">'+prompt+'<\/div><div class=\"opts\">';\n opts.forEach((o,n)=>{h+='<button class=\"opt'+(q.rev?' nm':'')+'\" style=\"animation-delay:'+n*0.07+'s\" data-n=\"'+o[0]+'\" onclick=\"pick(this)\">'+(q.rev?o[0]:o[1])+'<\/button>';});\n h+='<\/div><div id=\"msg\"><\/div>';\n $('app').innerHTML=h;\n}\nfunction pick(b){\n if(Q.lock)return;Q.lock=true;\n const ok=b.dataset.n===Q.cur.ans;\n if(ok){b.classList.add('good');Q.streak++;Q.pts+=10+Math.min(Q.streak-1,5)*2;confetti(25);say(Q.streak>=3?'سلسلة رائعة: '+Q.streak+' 🔥':rnd(GOOD),'var(--ok)');}\n else{b.classList.add('bad');Q.streak=0;document.querySelectorAll('.opt').forEach(x=>{if(x.dataset.n===Q.cur.ans)x.classList.add('good');});say(rnd(BAD),'var(--err)');}\n if(ok)Q.right=(Q.right||0)+1;\n setTimeout(()=>{Q.i++;if(Q.i<Q.n)ask();else finish();},1400);\n}\nfunction finish(){\n const r=Q.right||0,pc=r/Q.n,s=pc>=0.9?3:pc>=0.7?2:pc>=0.5?1:0;\n if(s>best[Q.l]){best[Q.l]=s;save();}\n if(s>=2)confetti(140);\n const msg=s===3?'ما شاء الله! حفظتَ المستوى كاملاً':s===2?'أحسنت! تقريباً أتقنتَ المستوى':s===1?'بداية جميلة، راجع وحاول مرة أخرى':'لا بأس، تعلّم مرة أخرى وستنجح';\n $('app').innerHTML='<div class=\"res\"><div class=\"e\">'+(s>=2?'🏆':'🌱')+'<\/div><h2>'+r+' من '+Q.n+'<\/h2><div class=\"s\">'+('⭐'.repeat(s)+'☆'.repeat(3-s))+'<\/div><p style=\"font-size:19px;font-weight:600\">'+msg+'<\/p><p>نقاطك: '+Q.pts+'<\/p><\/div><div class=\"row\"><button class=\"pri\" onclick=\"quiz('+Q.l+')\">🔄 اختبار جديد<\/button><button class=\"sec\" onclick=\"learn('+Q.l+')\">📖 تعلّم<\/button><\/div><div class=\"row\" style=\"margin-top:10px\">'+(Q.l<LV-1?'<button onclick=\"learn('+(Q.l+1)+')\">المستوى التالي ⬅<\/button>':'')+'<button onclick=\"home()\">🏠 الرئيسية<\/button><\/div>';\n}\nhome();\n<\/script>\n<\/body>\n<\/html>\n"};
function go(k){document.getElementById('menu').style.display='none';document.getElementById('game').style.display='flex';document.getElementById('f').srcdoc=G[k];}
function back(){document.getElementById('game').style.display='none';document.getElementById('f').srcdoc='';document.getElementById('menu').style.display='block';}
</script>
</body>
